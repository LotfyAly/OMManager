<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omgevingsmanagement dashboard v25 - dpi stijl</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root{
    /* dpi-geinspireerde UI-palette: aubergine als basis, magenta/oranje als energie-accent.
       De exacte merkkleuren uit een intern huisstijlhandboek zijn niet publiek geverifieerd;
       deze set is afgestemd op de actuele publieke dpi-uitingen en whitepapers. */
    --paper:#F7F4F6;
    --panel:#FFFFFF;
    --ink:#351638;
    --ink-soft:#675467;
    --ink-faint:#8E7D8D;
    --line:#E3D9E2;
    --line-strong:#C7B7C5;
    --accent:#4B214F;
    --accent-ink:#321436;
    --accent-tint:#F1E7F0;
    --brand-magenta:#D92E7D;
    --brand-purple:#4B214F;
    --brand-pink:#E9418D;
    --brand-orange:#F4772C;
    --brand-coral:#EF4E3E;

    --status-open-fg:#625963;    --status-open-bg:#EEE9ED;    --status-open-dot:#8D828D;
    --status-progress-fg:#8D4A0C; --status-progress-bg:#FFF0DC; --status-progress-dot:#E9822C;
    --status-done-fg:#2F644A;    --status-done-bg:#DDEDE4;    --status-done-dot:#4F8468;
    --status-blocked-fg:#81293C; --status-blocked-bg:#F6E2E6; --status-blocked-dot:#C4435B;

    --radius:0px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'IBM Plex Sans', sans-serif;
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:var(--font-display); margin:0; font-weight:600; }
  button{ font-family:inherit; font-size:inherit; }
  input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  button, [role="button"], .action-icon, .theme-add, .row-status{ cursor:pointer; }

  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }


  /* ---------- layout ---------- */
  #app{ display:flex; min-height:100vh; align-items:flex-start; }

  #sidebar{
    width:270px;
    flex:none;
    background:var(--panel);
    border-right:1px solid var(--line);
    min-height:100vh; height:100vh; position:sticky; top:0; overflow:hidden;
    padding:22px 16px;
    display:flex;
    flex-direction:column;
  }
  #sidebar h2{ font-size:13px; letter-spacing:0.02em; color:var(--ink-soft); margin-bottom:14px; font-weight:600; }
  #project-list{ display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto; }
  #project-search{ border:1px solid var(--line-strong); border-radius:2px; padding:7px 8px; background:#fff; color:var(--ink); width:100%; margin:-5px 0 10px; }

  #quick-add{
    position:relative; display:flex; flex-direction:column; gap:8px;
    margin:0 0 18px; padding:14px 12px 13px;
    background:linear-gradient(145deg,var(--accent-tint),#fff 72%);
    border:1px solid var(--line); border-top:4px solid var(--brand-magenta);
    box-shadow:0 5px 16px rgba(75,33,79,.08);
  }
  #quick-add::after{ content:'SNEL'; position:absolute; top:10px; right:10px; font-family:var(--font-display); font-size:9px; letter-spacing:.12em; font-weight:700; color:var(--brand-magenta); opacity:.78; }
  #quick-add label{ font-family:var(--font-display); font-size:13px; color:var(--accent-ink); font-weight:700; padding-right:44px; }
  #quick-add input, #quick-add select{ border:1px solid var(--line-strong); border-radius:2px; padding:8px 9px; background:#fff; color:var(--ink); width:100%; transition:border-color 120ms,box-shadow 120ms; }
  #quick-add input:focus, #quick-add select:focus{ border-color:var(--brand-magenta); box-shadow:0 0 0 2px rgba(217,46,125,.10); outline:none; }
  #quick-add input:disabled, #quick-add select:disabled{ background:var(--paper); color:var(--ink-faint); }
  #quick-add .qa-submit{ width:100%; justify-content:center; min-height:36px; background:var(--brand-magenta); border-color:var(--brand-magenta); font-weight:700; }
  #quick-add .qa-submit:hover{ background:var(--accent); border-color:var(--accent); }

  .overview-row{ display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none; border:none; border-left:2px solid transparent; border-bottom:1px solid var(--line); padding:9px 10px 13px 10px; margin-bottom:8px; border-radius:2px; font-family:var(--font-display); font-size:13.5px; font-weight:600; color:var(--ink); }
  .overview-row:hover{ background:var(--paper); }
  .overview-row.active{ border-left-color:var(--accent); background:var(--paper); color:var(--accent-ink); }
  .overview-count{ margin-left:auto; font-size:11px; color:var(--ink-faint); font-weight:500; }
  .overview-row.active .overview-count{ color:var(--accent-ink); }

  .project-row{
    position:relative;
    padding:10px 10px 10px 12px;
    border-left:2px solid transparent;
    border-top:2px solid transparent;
    border-radius:2px;
    display:flex;
    flex-direction:column;
    gap:6px;
    transition:opacity 120ms, background 120ms, box-shadow 120ms;
    cursor:pointer;
  }
  .project-row:hover{ background:var(--paper); }
  .project-row:focus-visible{ outline:2px solid var(--brand-magenta); outline-offset:2px; background:var(--paper); }
  .project-row:focus-within .p-actions{ opacity:1; }
  .project-row.active{ border-left-color:var(--accent); background:var(--paper); }
  .project-row.dragging{ opacity:0.4; }
  .project-row.drag-over{ border-top-color:var(--accent); }
  .project-row .p-top{ display:flex; align-items:flex-start; gap:6px; }
  .project-row .p-grip{ flex:none; padding-top:3px; color:var(--ink-faint); cursor:grab; opacity:0; transition:opacity 120ms; }
  .project-row:hover .p-grip{ opacity:1; }
  .project-row .p-main{ flex:1; min-width:0; }
  .project-row .p-name{ font-family:var(--font-display); font-size:14px; font-weight:600; line-height:1.3; }
  .project-row .p-loc{ font-size:11.5px; color:var(--ink-faint); }
  .project-row .p-actions{ display:flex; gap:4px; opacity:0; transition:opacity 120ms; flex:none; }
  .project-row:hover .p-actions, .project-row.active .p-actions{ opacity:1; }
  .mini-bar{ display:flex; height:3px; border-radius:2px; overflow:hidden; background:var(--line); }
  .mini-bar span{ display:block; }

  #new-project-btn{
    margin-top:14px;
    display:flex; align-items:center; gap:6px;
    background:none; border:1px dashed var(--line-strong);
    color:var(--ink-soft);
    padding:9px 10px; border-radius:2px;
    text-align:left;
    transition:border-color 120ms, color 120ms;
  }
  #new-project-btn:hover{ border-color:var(--accent); color:var(--accent-ink); }

  .pomodoro-card{
    display:flex; align-items:center; gap:16px; flex-wrap:nowrap;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:18px; min-height:128px;
  }
  .pomodoro-ring-wrap{ position:relative; width:86px; height:86px; flex:none; }
  .pomodoro-ring{ width:86px; height:86px; transform:rotate(-90deg); display:block; }
  .pomodoro-ring-bg{ fill:none; stroke:var(--line); stroke-width:8; }
  .pomodoro-ring-fg{ fill:none; stroke:var(--accent); stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset 400ms linear, stroke 300ms; }
  .pomodoro-card.pomodoro-mode-pauze .pomodoro-ring-fg,
  .pomodoro-card.pomodoro-mode-lange_pauze .pomodoro-ring-fg{ stroke:var(--status-done-dot); }
  .pomodoro-time-wrap{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #pomodoro-time{ font-family:var(--font-display); font-size:19px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
  #pomodoro-mode{ font-size:10.5px; color:var(--ink-soft); margin-top:2px; text-transform:none; }
  .pomodoro-side{ flex:1; min-width:0; display:flex; flex-direction:column; gap:7px; }
  .pomodoro-side-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .pomodoro-side-top h3{ font-size:14px; }
  #pomodoro-cycles{ letter-spacing:3px; color:var(--accent); font-size:11px; }
  .pomodoro-side label{ font-size:11.5px; color:var(--ink-soft); font-weight:500; }
  .pomodoro-side select{ border:1px solid var(--line-strong); border-radius:2px; padding:6px 8px; min-width:0; width:100%; background:#fff; color:var(--ink); }
  .pomodoro-controls{ display:flex; gap:8px; margin-top:2px; }
  .pomodoro-controls .btn{ flex:none; padding:7px 14px; }
  .pomodoro-complete-desc{ font-size:13px; color:var(--ink-soft); margin:-6px 0 16px; line-height:1.5; }

  #pomodoro-takeover{
    display:none; position:fixed; inset:0; z-index:1000;
    background:var(--paper); align-items:center; justify-content:center; padding:40px;
  }
  .pomodoro-takeover-inner{ display:flex; flex-direction:column; align-items:center; gap:16px; max-width:440px; text-align:center; }
  .pomodoro-ring-wrap-xl{ position:relative; width:220px; height:220px; }
  .pomodoro-ring-wrap-xl .pomodoro-ring{ width:220px; height:220px; transform:rotate(-90deg); display:block; }
  #pomodoro-time-xl{ font-family:var(--font-display); font-size:46px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
  #pomodoro-mode-xl{ font-size:13px; color:var(--ink-soft); margin-top:4px; }
  .pomodoro-takeover-context{ display:flex; flex-direction:column; gap:4px; }
  .pomodoro-takeover-context strong{ font-family:var(--font-display); font-size:19px; font-weight:600; }
  .pomodoro-takeover-context span{ font-size:12.5px; color:var(--ink-soft); }
  .pomodoro-takeover-noaction{ color:var(--ink-faint); font-style:italic; font-size:13px; }
  #pomodoro-cycles-xl{ letter-spacing:4px; color:var(--accent); font-size:13px; }
  .pomodoro-takeover-controls{ display:flex; gap:10px; margin-top:4px; }
  .pomodoro-takeover-controls .btn{ padding:11px 24px; }
  .pomodoro-takeover-hint{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; }

  #main{ flex:1; min-width:0; padding:32px 40px 60px; }

  #empty-state{ max-width:420px; margin-top:60px; color:var(--ink-soft); }
  #empty-state h2{ font-size:20px; margin-bottom:8px; color:var(--ink); }

  /* ---------- header ---------- */
  #project-header{ margin-bottom:26px; }
  #project-header.project-header-colored{
    background:var(--project-header-bg,var(--accent));
    color:var(--project-header-fg,#fff);
    padding:20px 22px 15px;
    border:1px solid rgba(0,0,0,.10);
    border-left:6px solid rgba(0,0,0,.20);
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.10);
  }
  .ph-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap; }
  .ph-title h1{ font-size:27px; }
  .ph-title .loc{ color:var(--ink-soft); font-size:13px; margin-top:3px; }
  .project-header-colored .ph-title .loc{ color:currentColor; opacity:.78; }
  .project-header-colored .project-context{ margin-top:9px; }
  .project-header-colored .context-chip{ background:rgba(255,255,255,.90); color:var(--ink); border-color:rgba(255,255,255,.98); }
  .project-header-colored .ph-tools .btn{ background:rgba(255,255,255,.94); color:var(--ink); border-color:rgba(255,255,255,.98); }
  .project-header-colored .ph-tools .btn:hover{ background:#fff; color:var(--accent-ink); border-color:#fff; }
  .project-header-colored .ph-progress{ margin-top:16px; }
  .project-header-colored .stack-bar{ background:rgba(255,255,255,.28); }
  .project-header-colored .ph-stats .stat{ color:currentColor; opacity:.90; }
  .project-header-colored #save-indicator{ color:currentColor; opacity:.72; }
  .ph-tools{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

  .btn{
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 12px; border-radius:2px;
    border:1px solid var(--line-strong);
    background:var(--panel); color:var(--ink);
    transition:background 120ms, border-color 120ms;
    white-space:nowrap;
  }
  .btn:hover{ border-color:var(--brand-magenta); color:var(--accent-ink); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-ink); border-color:var(--brand-magenta); color:#fff; }
  .btn-quiet{ border-color:transparent; background:transparent; padding:6px; }
  .btn-quiet:hover{ background:var(--accent-tint); border-color:transparent; }

  .ph-progress{ margin-top:18px; }
  .stack-bar{ display:flex; height:6px; border-radius:2px; overflow:hidden; background:var(--line); }
  .stack-bar span{ display:block; }
  .ph-stats{ display:flex; gap:16px; margin-top:10px; flex-wrap:wrap; }
  .stat{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft); }
  .stat .dot{ width:8px; height:8px; border-radius:1px; display:inline-block; }

  #save-indicator{ font-size:11.5px; color:var(--ink-faint); margin-top:10px; min-height:14px; }

  #storage-banner{
    display:none;
    background:var(--status-progress-bg); color:var(--status-progress-fg);
    border:1px solid var(--status-progress-dot);
    border-radius:2px; padding:9px 12px; font-size:12.5px; margin-bottom:18px;
  }

  /* ---------- authenticatie ---------- */
  #auth-overlay{
    display:none; position:fixed; inset:0; z-index:2000;
    background:var(--paper); align-items:center; justify-content:center; padding:24px;
  }
  #auth-overlay.visible{ display:flex; }
  .auth-card{
    width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line);
    border-top:4px solid var(--brand-magenta); padding:28px 26px;
    box-shadow:0 5px 16px rgba(75,33,79,.08);
  }
  .auth-card h1{ font-family:var(--font-display); font-size:19px; margin:0 0 6px; }
  .auth-card p{ font-size:13px; color:var(--ink-soft); margin:0 0 18px; line-height:1.5; }
  .auth-card input{ border:1px solid var(--line-strong); border-radius:2px; padding:9px 10px; background:#fff; color:var(--ink); width:100%; margin-bottom:12px; }
  .auth-card input:focus{ border-color:var(--brand-magenta); box-shadow:0 0 0 2px rgba(217,46,125,.10); outline:none; }
  .auth-card button{ width:100%; justify-content:center; min-height:38px; background:var(--brand-magenta); border:1px solid var(--brand-magenta); color:#fff; font-weight:700; padding:9px 14px; }
  .auth-card button:hover{ background:var(--accent); border-color:var(--accent); }
  .auth-card button:disabled{ opacity:.6; cursor:default; }
  #auth-status{ font-size:12.5px; color:var(--ink-soft); margin-top:12px; min-height:16px; }
  #auth-status.error{ color:var(--status-blocked-fg); }
  #auth-status.success{ color:var(--status-done-fg); }
  #logout-btn{
    display:none; margin-top:8px; align-items:center; gap:6px;
    background:none; border:1px dashed var(--line-strong); color:var(--ink-soft);
    padding:9px 10px; border-radius:2px; text-align:left; font-size:12.5px;
    transition:border-color 120ms, color 120ms;
  }
  #logout-btn:hover{ border-color:var(--accent); color:var(--accent-ink); }

  /* ---------- theme grid ---------- */
  #theme-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:18px;
  }
  @media (max-width:1100px){ #theme-grid{ grid-template-columns:repeat(2,1fr);} }
  @media (max-width:680px){ #theme-grid{ grid-template-columns:1fr;} #app{ flex-direction:column;} #sidebar{ width:100%; min-height:auto; border-right:none; border-bottom:1px solid var(--line);} #main{ padding:24px 18px 50px;} }

  .theme-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 16px 12px;
    display:flex; flex-direction:column;
  }
  .tp-head{
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    margin:-16px -16px 12px; padding:12px 14px 11px; min-height:64px;
    background:var(--accent); color:#fff; border-left:5px solid var(--brand-magenta);
    border-bottom:1px solid var(--accent-ink);
  }
  .tp-head > div:first-child{ min-width:0; }
  .tp-head-actions{ display:flex; align-items:center; gap:8px; flex:none; }
  .tp-head .bulk-action-btn{ background:transparent; color:#fff; border-color:rgba(255,255,255,.6); }
  .tp-head .bulk-action-btn:hover{ background:#fff; color:var(--accent); border-color:#fff; }
  .tp-head .add-action-plus{ box-shadow:0 0 0 1px rgba(255,255,255,.18); }
  .add-action-plus{ width:30px; height:30px; min-width:30px; padding:0; border:1px solid var(--brand-magenta); background:var(--brand-magenta); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:21px; font-weight:600; line-height:1; border-radius:2px; cursor:pointer; transition:background 120ms,border-color 120ms,transform 120ms; }
  .add-action-plus:hover{ background:var(--brand-purple); border-color:var(--brand-purple); }
  .add-action-plus:active{ transform:translateY(1px); }
  .add-action-plus:focus-visible{ outline:2px solid var(--brand-orange); outline-offset:2px; }
  .bulk-action-btn{ min-height:30px; padding:4px 9px; border:1px solid var(--brand-magenta); background:#fff; color:var(--brand-magenta); display:inline-flex; align-items:center; justify-content:center; gap:5px; font-size:11px; font-weight:700; border-radius:2px; cursor:pointer; transition:background 120ms,color 120ms,border-color 120ms; }
  .bulk-action-btn:hover{ background:var(--accent-tint); color:var(--brand-purple); border-color:var(--brand-purple); }
  .bulk-action-btn:focus-visible{ outline:2px solid var(--brand-orange); outline-offset:2px; }
  .bulk-target{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:-4px 0 14px; }
  .bulk-paste{ min-height:170px!important; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12px!important; line-height:1.45; }
  .bulk-help{ font-size:11.5px; color:var(--ink-faint); line-height:1.5; margin-top:5px; }
  .bulk-help code{ font-family:ui-monospace,SFMono-Regular,Consolas,monospace; background:var(--paper); padding:1px 4px; border:1px solid var(--line); }
  .bulk-preview{ border:1px solid var(--line); background:#fff; margin-top:10px; overflow:auto; max-height:230px; }
  .bulk-preview-empty{ padding:14px; color:var(--ink-faint); font-size:12px; }
  .bulk-preview-summary{ display:flex; justify-content:space-between; gap:10px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--line); background:var(--paper); font-size:11.5px; }
  .bulk-preview-summary strong{ color:var(--ink); }
  .bulk-preview table{ width:100%; border-collapse:collapse; font-size:11.5px; }
  .bulk-preview th,.bulk-preview td{ text-align:left; vertical-align:top; padding:6px 8px; border-bottom:1px solid var(--line); }
  .bulk-preview th{ position:sticky; top:0; background:var(--panel); color:var(--ink-soft); font-weight:600; }
  .bulk-preview tr:last-child td{ border-bottom:none; }
  .bulk-warning{ color:var(--status-progress-fg); }
  .tp-head h3{ font-size:15.5px; display:flex; align-items:center; gap:7px; color:#fff; letter-spacing:.01em; }
  .tp-status-dot{ width:9px; height:9px; border-radius:50%; flex:none; display:inline-block; box-shadow:0 0 0 2px rgba(255,255,255,.78); }
  .tp-head .tp-desc{ font-size:11.5px; color:rgba(255,255,255,.72); margin-top:2px; }
  .tp-count{ font-size:11.5px; color:rgba(255,255,255,.72); flex:none; padding-top:2px; min-width:18px; text-align:center; }
  .tp-bar{ margin-top:10px; margin-bottom:4px; }
  .theme-status-strip{ margin:-16px -16px 0; height:9px; min-height:9px; border-radius:0; flex:none; }
  .theme-status-strip + .tp-head{ margin-top:0; }
  .theme-panel{ border-top:0 !important; }
  .theme-status-strip-empty{ background:var(--line); }

  .action-subactions-box{ border:1px solid var(--line); background:var(--paper); padding:11px 12px; margin:3px 0 14px; }
  .action-subactions-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .action-subactions-head strong{ font-size:12.5px; }
  .action-subactions-meta{ color:var(--ink-faint); font-size:11px; margin-top:2px; }
  .action-subactions-existing{ margin-top:9px; display:flex; flex-wrap:wrap; gap:5px; }
  .action-subactions-checklist{ margin-top:10px; border-top:1px solid var(--line); }
  .action-subaction-check{ display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:9px; align-items:start; padding:8px 0; border-bottom:1px solid var(--line); }
  .action-subaction-check input[type=checkbox]{ width:16px; height:16px; margin:1px 0 0; accent-color:var(--accent); }
  .action-subaction-check-main{ min-width:0; }
  .action-subaction-check-title{ font-size:12px; font-weight:500; line-height:1.35; }

  .tp-status-bar{

  .tp-status-bar.status-aandacht .tp-status-pill{ background:var(--status-progress-bg); color:var(--status-progress-fg); }
  .tp-status-bar.status-kritiek .tp-status-pill{ background:var(--status-blocked-bg); color:var(--status-blocked-fg); }
  .tp-status-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }

  /* ---------- themamijlpalen / belangrijke deadlines ---------- */
  .theme-milestones{ margin:0 0 8px; border:1px solid var(--line); background:var(--paper); }
  .theme-milestones-head{ display:flex; align-items:center; gap:8px; min-height:31px; padding:5px 8px; border-bottom:1px solid var(--line); background:#fff; }
  .theme-milestones-head strong{ font-size:11.5px; font-weight:600; color:var(--ink-soft); }
  .theme-milestones-count{ font-size:10.5px; color:var(--ink-faint); }
  .theme-milestones-add{ margin-left:auto; width:24px; height:24px; min-width:24px; padding:0; font-size:17px; line-height:1; }
  .theme-milestones-list{ display:flex; flex-direction:column; }
  .theme-milestone-row{ display:grid; grid-template-columns:72px auto 1fr auto; gap:7px; align-items:center; min-height:31px; padding:5px 8px; border-top:1px solid var(--line); cursor:pointer; }
  .theme-milestone-row:first-child{ border-top:none; }
  .theme-milestone-row:hover{ background:var(--accent-tint); }
  .theme-milestone-date{ font-size:10.5px; font-weight:600; color:var(--ink-soft); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .theme-milestone-type{ font-size:9.5px; padding:1px 5px; border:1px solid var(--line-strong); background:#fff; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.02em; white-space:nowrap; }
  .theme-milestone-title{ min-width:0; font-size:11.5px; line-height:1.3; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .theme-milestone-status{ font-size:9.5px; font-weight:600; color:var(--status-done-fg); white-space:nowrap; }
  .theme-milestone-row.overdue{ box-shadow:inset 3px 0 0 var(--status-blocked-dot); }
  .theme-milestone-row.overdue .theme-milestone-date{ color:var(--status-blocked-fg); }
  .theme-milestone-row.done{ opacity:.62; }
  .theme-milestone-empty{ padding:7px 8px; font-size:11px; color:var(--ink-faint); font-style:italic; }

  .action-list{ display:flex; flex-direction:column; margin-top:6px; }
  .action-row{
    display:flex; align-items:flex-start; gap:8px;
    padding:9px 4px;
    border-top:1px solid var(--line);
  }
  .action-row:first-child{ border-top:none; }
  .row-main{ flex:1; min-width:0; }
  .row-title{ font-size:13px; font-weight:500; word-break:break-word; display:flex; align-items:flex-start; gap:5px; }
  .row-title-open{ cursor:pointer; }
  .row-title-open:hover{ color:var(--brand-magenta); text-decoration:underline; text-underline-offset:2px; }
  .row-meta{ display:flex; gap:12px; margin-top:4px; flex-wrap:wrap; }
  .row-meta span{ display:inline-flex; align-items:center; gap:4px; font-size:11.5px; color:var(--ink-faint); }
  .row-meta .overdue{ color:var(--status-blocked-fg); font-weight:500; }
  .row-actions{ display:flex; gap:2px; opacity:0; transition:opacity 120ms; flex:none; }
  .action-row:hover .row-actions, .action-row:focus-within .row-actions{ opacity:1; }
  .action-group{ border-top:1px solid var(--line); }
  .action-group:first-child{ border-top:none; }
  .action-group > .action-row{ border-top:none; }
  .subaction-summary{ margin-top:8px; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .subaction-summary-label{ font-size:10.5px; color:var(--ink-faint); font-weight:600; }
  .subaction-count{ display:inline-flex; align-items:center; gap:4px; padding:2px 6px; font-size:10px; border:1px solid var(--line); background:var(--paper); color:var(--ink-soft); }
  .subaction-count .dot{ width:6px; height:6px; display:inline-block; }
  .subaction-progress{ flex:1 1 120px; max-width:190px; min-width:90px; height:5px; display:flex; overflow:hidden; background:var(--line); }
  .subaction-progress span{ height:100%; display:block; }
  .subaction-list{ margin:2px 4px 9px 43px; border-left:2px solid var(--accent-tint); background:linear-gradient(90deg,rgba(241,231,240,.55),rgba(255,255,255,0) 76%); }
  .subaction-row{ display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:8px; align-items:start; padding:7px 8px 7px 10px; border-top:1px dashed var(--line); }
  .subaction-row:first-child{ border-top:none; }
  .subaction-main{ min-width:0; }
  .subaction-title{ font-size:12px; font-weight:500; line-height:1.35; word-break:break-word; }
  .subaction-meta{ display:flex; gap:8px; flex-wrap:wrap; margin-top:3px; font-size:10.5px; color:var(--ink-faint); }
  .subaction-actions{ display:flex; gap:1px; opacity:.35; transition:opacity 120ms; }
  .subaction-row:hover .subaction-actions, .subaction-row:focus-within .subaction-actions{ opacity:1; }
  .subaction-row .status-select{ font-size:10px; padding:3px 19px 3px 6px; margin:0; max-width:112px; }
  .subaction-empty{ margin:3px 4px 9px 43px; padding:7px 10px; border-left:2px solid var(--accent-tint); color:var(--ink-faint); font-size:10.5px; }
  .action-icon{ background:none; border:none; padding:4px; color:var(--ink-faint); border-radius:2px; display:flex; }
  .action-icon:hover{ background:var(--accent-tint); color:var(--accent-ink); }

  .status-select{
    appearance:none; -webkit-appearance:none;
    border:1px solid transparent; border-radius:2px;
    padding:4px 22px 4px 8px; font-size:11px; font-weight:500;
    flex:none; margin-top:1px;
    background-repeat:no-repeat; background-position:right 6px center; background-size:9px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23555' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  }
  .status-select.status-open{ background-color:var(--status-open-bg); color:var(--status-open-fg); }
  .status-select.status-in_uitvoering{ background-color:var(--status-progress-bg); color:var(--status-progress-fg); }
  .status-select.status-afgerond{ background-color:var(--status-done-bg); color:var(--status-done-fg); }
  .status-select.status-geblokkeerd{ background-color:var(--status-blocked-bg); color:var(--status-blocked-fg); }

  .theme-empty{ font-size:12.5px; color:var(--ink-faint); font-style:italic; padding:8px 4px 4px; }

  .theme-add{
    margin-top:10px; padding-top:8px; border-top:1px dashed var(--line);
    background:none; border-left:none; border-right:none; border-bottom:none;
    color:var(--accent-ink); font-size:12.5px; text-align:left;
    display:flex; align-items:center; gap:5px;
  }
  .theme-add:hover{ text-decoration:underline; color:var(--brand-magenta); }
  /* Legacy actieknoppen onder themakaarten zijn definitief uitgezet; invoer loopt via de kop (+ / Bulk). */
  .theme-panel > .theme-add,
  .theme-panel .theme-add[data-action="new-action"],
  .theme-panel > button[data-action="new-action"]:not(.add-action-plus){ display:none !important; }

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(32,38,31,0.35);
    display:flex; align-items:flex-start; justify-content:center;
    padding:60px 20px; overflow-y:auto; z-index:50;
  }
  .modal{
    background:var(--panel); border:1px solid var(--line-strong); border-radius:var(--radius);
    width:100%; max-width:460px; padding:22px 24px 24px;
  }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .modal-head h2{ font-size:17px; }
  .field{ margin-bottom:14px; display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:12px; color:var(--ink-soft); font-weight:500; }
  .field input, .field select, .field textarea{
    border:1px solid var(--line-strong); border-radius:2px; padding:8px 9px;
    background:#fff; color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:64px; }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .ts-links{ display:flex; flex-direction:column; gap:8px; margin-bottom:8px; }

  .ts-link-row input{ border:1px solid var(--line-strong); border-radius:2px; padding:7px 8px; background:#fff; color:var(--ink); font-size:12.5px; }
  .ts-link-row .ts-link-label{ flex:0 0 34%; }

  .modal-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; }
  .modal-actions .right{ display:flex; gap:8px; }
  .danger-link{ background:none; border:none; color:var(--status-blocked-fg); font-size:12.5px; padding:6px 2px; }
  .danger-link:hover{ text-decoration:underline; }

  /* ---------- toast ---------- */
  #toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); font-size:12.5px;
    padding:9px 16px; border-radius:2px; opacity:0; pointer-events:none;
    transition:opacity 200ms;
    z-index:60;
  }
  #toast.visible{ opacity:1; }

  #import-input{ display:none; }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }

  /* ---------- weergave-switch ---------- */
  .view-switch{ display:flex; gap:2px; background:var(--panel); border:1px solid var(--line-strong); border-radius:2px; padding:2px; }
  .view-switch button{ border:none; background:none; padding:7px 11px; border-radius:2px; font-size:12.5px; color:var(--ink-soft); transition:background 120ms,color 120ms; }
  .view-switch button:hover{ color:var(--ink); }
  .view-switch button.active{ background:var(--accent); color:#fff; }

  /* ---------- lijstweergave ---------- */
  .list-toolbar{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .toolbar-actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .filter-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .filter-chip{ border:1px solid var(--line-strong); background:var(--panel); border-radius:2px; padding:5px 10px; font-size:12px; color:var(--ink-soft); display:inline-flex; align-items:center; gap:5px; transition:border-color 120ms,color 120ms; }
  .filter-chip:hover{ border-color:var(--accent); }
  .filter-chip.active{ border-color:var(--accent); background:var(--accent-tint); color:var(--accent-ink); }
  .chip-count{ font-size:10.5px; color:var(--ink-faint); }
  .filter-chip.active .chip-count{ color:var(--accent-ink); }
  #sort-select{ border:1px solid var(--line-strong); border-radius:2px; padding:7px 8px; background:#fff; color:var(--ink); }
  .list-panel{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:6px 16px 12px; }
  .theme-badge{ background:var(--accent-tint); color:var(--accent-ink); font-size:10.5px; padding:2px 6px; border-radius:2px; font-weight:500; }
  .project-badge{ background:#fff; border:1px solid var(--line-strong); color:var(--ink-soft); font-size:10.5px; padding:1px 6px; border-radius:2px; font-weight:500; }

  /* ---------- kalenderweergave ---------- */
  .cal-toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .cal-toolbar h3{ font-size:15px; min-width:150px; text-align:center; text-transform:capitalize; }
  .cal-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .cal-weekday{ background:var(--panel); font-size:11px; color:var(--ink-faint); text-align:center; padding:6px 0; font-weight:500; }
  .cal-cell{ background:#fff; min-height:130px; padding:8px; display:flex; flex-direction:column; gap:5px; transition:background 120ms, box-shadow 120ms; }
  .cal-cell.cal-empty{ background:var(--paper); }
  .cal-cell.cal-today{ box-shadow:inset 0 0 0 1.5px var(--accent); }
  .cal-cell.cal-drop-target{ background:var(--accent-tint); box-shadow:inset 0 0 0 2px var(--accent); }
  .cal-daynum{ font-size:12px; color:var(--ink-soft); font-weight:500; }
  .cal-chips{ display:flex; flex-direction:column; gap:3px; }
  .cal-chip{ border:none; text-align:left; font-size:11px; line-height:1.35; padding:3px 6px; border-radius:2px; white-space:normal; word-break:break-word; cursor:grab; }
  .cal-chip.dragging{ opacity:0.4; }
  .cal-chip.status-open{ background:var(--status-open-bg); color:var(--status-open-fg); }
  .cal-chip.status-in_uitvoering{ background:var(--status-progress-bg); color:var(--status-progress-fg); }
  .cal-chip.status-afgerond{ background:var(--status-done-bg); color:var(--status-done-fg); }
  .cal-chip.status-geblokkeerd{ background:var(--status-blocked-bg); color:var(--status-blocked-fg); }

  @media (max-width:680px){ .cal-grid{ grid-template-columns:repeat(5,minmax(70px,1fr)); overflow-x:auto; } .cal-cell{ min-height:90px; } .cal-toolbar h3{ min-width:auto; flex:1; } }

  .context-chip{ display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); background:var(--panel); color:var(--ink-soft); padding:3px 7px; border-radius:2px; font-size:11px; }

  .config-section{ border-top:1px solid var(--line); margin-top:18px; padding-top:16px; }
  .config-section h3{ font-size:14px; margin-bottom:5px; }
  .config-help{ color:var(--ink-faint); font-size:11.5px; margin-bottom:10px; }

  .module-config span{ font-size:11px; color:var(--ink-faint); display:block; }
  .modal.modal-wide{ max-width:720px; }

  function buildWeekdayCalendarGrid(byDate, chipRenderer, addActionHtml){
    var cursor = calendarCursor;
    var year = cursor.getFullYear(), month = cursor.getMonth();
    var first = new Date(year, month, 1);
    var startWeekday = (first.getDay()+6)%7; // 0=ma … 6=zo
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var todayIso = toISODate(new Date());

    var leading = startWeekday <= 4 ? startWeekday : 0;
    var cells = '';
    for(var i=0;i<leading;i++){ cells += '<div class="cal-cell cal-empty"></div>'; }

    var rendered = 0;
    var weekendItems = [];
    for(var d=1; d<=daysInMonth; d++){
      var dateObj = new Date(year, month, d);
      var wd = (dateObj.getDay()+6)%7;
      var iso = toISODate(dateObj);
      if(wd >= 5){
        if(byDate[iso]) weekendItems = weekendItems.concat(byDate[iso]);
        continue;
      }
      var items = byDate[iso] || [];
      var chips = items.map(chipRenderer).join('');
      cells += '<div class="cal-cell'+(iso===todayIso?' cal-today':'')+'" data-date="'+iso+'">' +
        '<div class="cal-daynum">'+d+'</div>' +
        '<div class="cal-chips">'+chips+'</div>' +
      '</div>';
      rendered++;
    }
    var totalCells = leading + rendered;
    var trailing = (5 - (totalCells % 5)) % 5;
    for(var j=0;j<trailing;j++){ cells += '<div class="cal-cell cal-empty"></div>'; }

    var monthLabel = cursor.toLocaleDateString('nl-NL', { month:'long', year:'numeric' });
    var weekdayLabels = ['ma','di','wo','do','vr'].map(function(w){ return '<div class="cal-weekday">'+w+'</div>'; }).join('');

      '<div class="cal-toolbar">' +
        '<button class="btn btn-quiet" data-action="cal-prev" aria-label="Vorige maand">‹</button>' +

  function formatBytes(n){
    if(n===undefined || n===null) return '';
    if(n < 1024) return n + ' B';
    if(n < 1024*1024) return Math.round(n/1024) + ' KB';
    return (n/1024/1024).toFixed(1) + ' MB';
  }

  function downloadEml(filename, content){
    var name = filename && filename.toLowerCase().indexOf('.eml') !== -1 ? filename : (filename||'bericht')+'.eml';
    var blob = new Blob([content], { type:'message/rfc822' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function handleEmlFile(file){
    if(!file) return;
    var lname = file.name.toLowerCase();
    if(lname.indexOf('.eml') === -1){
      if(lname.indexOf('.msg') !== -1){
        alert('Dit is een Outlook .msg-bestand — dat kan ik niet lezen. Gebruik in Outlook Web of Gmail de optie "Bericht downloaden" / "Origineel downloaden" om een .eml-bestand te krijgen.');
      } else {
        alert('Alleen .eml-bestanden worden ondersteund. Sla de e-mail in je mailprogramma op als .eml en probeer het opnieuw.');
      }
      return;
    }
    if(file.size > 4*1024*1024){
      alert('Dit bestand is groter dan 4 MB — dat is te groot om automatisch op te slaan. Verwijder eventuele grote bijlagen/afbeeldingen uit de e-mail zelf en sla het opnieuw op als .eml. Tip: exporteren als JSON kent geen groottelimiet, alleen automatisch opslaan.');
      return;
    }
    var reader = new FileReader();
    reader.onload = function(){
      pendingAttachment = { naam:file.name, inhoud:reader.result, grootte:file.size, gekoppeldOp:new Date().toISOString().slice(0,10) };
      var statusEl = document.getElementById('eml-attached');
      if(statusEl) statusEl.innerHTML = attachmentStatusHtml(pendingAttachment);
      var parsed = parseEmailText(reader.result);
      var titelEl = document.getElementById('af-titel');
      if(titelEl && !titelEl.value.trim() && parsed.titel){ titelEl.value = parsed.titel; }
      var verEl = document.getElementById('af-verantwoordelijke');
      if(verEl && !verEl.value.trim() && parsed.afzender){ verEl.value = parsed.afzender; }
      if(typeof actionModalAutosave==='function') actionModalAutosave();
      showToast('E-mail gekoppeld: ' + file.name);
    };
    reader.onerror = function(){ alert('Het bestand kon niet worden gelezen.'); };
    reader.readAsText(file);
  }

  function handleDroppedEmailText(text){
    if(!text || !text.trim()) return;

      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

  function safeHexColor(value, fallback){

    return /^#[0-9a-f]{6}$/i.test(v) ? v : (fallback||'#4B214F');

  function contrastTextColor(hex){
    var c=safeHexColor(hex,'#4B214F').slice(1);
    var r=parseInt(c.slice(0,2),16), g=parseInt(c.slice(2,4),16), b=parseInt(c.slice(4,6),16);
    var luminance=(0.299*r + 0.587*g + 0.114*b);

  function normalizeDocumentUrl(value){
    var url = String(value||'').trim();
    if(!url) return '';
    if(/^https?:\/\//i.test(url)) return url;
    return 'https://' + url.replace(/^\/\//,'');
  }

  function safeDocumentUrl(value){
    var url = normalizeDocumentUrl(value);
    if(!url) return '';
    try{
      var parsed = new URL(url);
      return (parsed.protocol==='http:' || parsed.protocol==='https:') ? parsed.href : '';
    }catch(e){ return ''; }
  }

  function formatDate(iso){
    if(!iso) return '';
    var parts = iso.split('-');
    if(parts.length!==3) return iso;
    var d = parseInt(parts[2],10), m = parseInt(parts[1],10)-1, y = parts[0];
    if(isNaN(d) || isNaN(m) || !MONTHS[m]) return iso;
    return d + ' ' + MONTHS[m] + ' ' + y;
  }

  function formatDateTime(iso){
    if(!iso) return '';
    if(/^\d{4}-\d{2}-\d{2}$/.test(iso)) return formatDate(iso);
    var d = new Date(iso);
    if(isNaN(d.getTime())) return formatDate(iso);
    return d.toLocaleDateString('nl-NL', { day:'numeric', month:'short', year:'numeric' }) + ' · ' +
      d.toLocaleTimeString('nl-NL', { hour:'2-digit', minute:'2-digit' });
  }

  function sameLinks(a,b){
    var clean=function(arr){ return (arr||[]).map(function(l){ return {label:(l.label||'').trim(),url:(l.url||'').trim()}; }).filter(function(l){ return l.url; }); };
    return JSON.stringify(clean(a))===JSON.stringify(clean(b));
  }

  function statusSnapshotChanged(oldTs, newStatus, newText, newLinks){
    return oldTs.status!==newStatus || (oldTs.tekst||'')!==newText || !sameLinks(oldTs.links,newLinks);

  function statusHistoryPeriod(entry, project){
    var start = entry.bijgewerktOp || project.aangemaaktOp || '';

    if(start && end) return formatDateTime(start) + ' → ' + formatDateTime(end);

  function actionMetrics(actions){
    var today=new Date(); today.setHours(0,0,0,0);
    var plus7=new Date(today); plus7.setDate(plus7.getDate()+7);
    var overdue=0, due7=0, blocked=0;
    actions.forEach(function(a){
      if(a.status==='afgerond') return;
      if(a.status==='geblokkeerd') blocked++;
      if(!a.deadline) return;
      var d=new Date(a.deadline+'T00:00:00');
      if(d<today) overdue++;
      else if(d<=plus7) due7++;
    });
    return { overdue:overdue, due7:due7, blocked:blocked };
  }

  function cleanSender(s){
    var m = s.match(/^"?([^"<]+)"?\s*<[^>]+>/);
    if(m) return m[1].trim();
    return s.replace(/<[^>]+>/,'').trim();
  }

  function parseEmailText(text){
    var lines = text.split(/\r?\n/);
    var result = { titel:'', afzender:'', ontvangen:'', body:'' };
    var headerEndIdx = 0;
    var sawHeader = false;
    for(var i=0; i<lines.length && i<15; i++){
      var line = lines[i];
      var mFrom = line.match(/^\s*(van|from)\s*:\s*(.+)$/i);
      var mSubj = line.match(/^\s*(onderwerp|subject)\s*:\s*(.+)$/i);
      var mDate = line.match(/^\s*(datum|verzonden|sent|date)\s*:\s*(.+)$/i);
      if(mFrom){ result.afzender = cleanSender(mFrom[2]); headerEndIdx = i+1; sawHeader = true; continue; }
      if(mSubj){ result.titel = mSubj[2].trim(); headerEndIdx = i+1; sawHeader = true; continue; }
      if(mDate){ result.ontvangen = mDate[2].trim(); headerEndIdx = i+1; sawHeader = true; continue; }
      if(sawHeader && line.trim()===''){ headerEndIdx = i+1; break; }
    }
    if(!result.titel){
      for(var j=0; j<lines.length; j++){
        if(lines[j].trim()){ result.titel = lines[j].trim().slice(0,120); if(!sawHeader) headerEndIdx = j+1; break; }
      }
    }
    var body = lines.slice(headerEndIdx).join('\n').trim();
    if(result.ontvangen){ body = 'Ontvangen: ' + result.ontvangen + (body ? '\n\n' + body : ''); }
    result.body = body.slice(0, 1000);
    return result;
  }

  function statusMeta(key){
    for(var i=0;i<STATUSES.length;i++){ if(STATUSES[i].key===key) return STATUSES[i]; }

  /* ============ opslag (autosave) ============ */

  var savedAttachmentSignatures = {}; // actionId -> laatst succesvol opgeslagen 'handtekening', om onnodig heruploaden te voorkomen

  function attachmentSignature(bijlage){
    return bijlage.naam + ':' + bijlage.grootte + ':' + (bijlage.gekoppeldOp||'');
  }

  function scheduleSave(){
    if(!storageAvailable) return;
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 500);
  }

  function doSave(){
    if(!storageAvailable) return;

    // Bouw een lichte kopie van de state: bijlage-inhoud gaat niet mee in de hoofdsleutel,
    // maar krijgt een eigen opslagsleutel per actie. Zo blokkeert één grote e-mail niet
    // het opslaan van de rest van je projecten.
    var attachmentsToSave = [];
    var liveActionIds = {};
    var lightProjects = state.projects.map(function(p){
      var lightThemas = {};
      projectThemes(p, true).forEach(function(th){
        lightThemas[th.key] = (p.themas[th.key]||[]).map(function(a){
          liveActionIds[a.id] = true;
          var copy = Object.assign({}, a);
          if(copy.bijlage && copy.bijlage.inhoud){
            var sig = attachmentSignature(copy.bijlage);
            if(savedAttachmentSignatures[a.id] !== sig){
              attachmentsToSave.push({ actionId:a.id, inhoud:copy.bijlage.inhoud, sig:sig });
            }
            copy.bijlage = { naam:copy.bijlage.naam, grootte:copy.bijlage.grootte, gekoppeldOp:copy.bijlage.gekoppeldOp, opgeslagenApart:true };
          }
          return copy;
        });
      });
      return Object.assign({}, p, { themas: lightThemas });
    });
    var lightState = { projects: lightProjects, activeProjectId: state.activeProjectId };

    // Ruim opgeslagen bijlagen op van acties die niet meer bestaan.
    Object.keys(savedAttachmentSignatures).forEach(function(actionId){
      if(!liveActionIds[actionId]){
        storageDelete(STORAGE_KEY + ':att:' + actionId).catch(function(){});
        delete savedAttachmentSignatures[actionId];
      }
    });

    var mainSave = storageSet(STORAGE_KEY, JSON.stringify(lightState));
    var attachmentSaves = attachmentsToSave.map(function(att){
      return storageSet(STORAGE_KEY + ':att:' + att.actionId, att.inhoud).then(function(res){
        if(res) savedAttachmentSignatures[att.actionId] = att.sig;
        return res;
      });
    });

    Promise.all([mainSave].concat(attachmentSaves)).then(function(results){
      if(results[0]){
        var now = new Date();
        var hh = String(now.getHours()).padStart(2,'0');
        var mm = String(now.getMinutes()).padStart(2,'0');
        var el = document.getElementById('save-indicator');
        if(el) el.textContent = 'Automatisch opgeslagen om ' + hh + ':' + mm;
      }
      if(results.slice(1).some(function(r){ return !r; })){
        showToast('Een gekoppelde e-mail kon niet automatisch worden opgeslagen — exporteer om die te bewaren.');
      }
    }).catch(function(){
      showToast('Automatisch opslaan is mislukt — exporteer om werk niet te verliezen.');
    });
  }

  function loadFromStorage(){
    if(!storageAvailable){
      showStorageBanner();
      return Promise.resolve(false);
    }
    return storageGet(STORAGE_KEY).then(function(res){
      if(!(res && res.value)) return false;
      var parsed;
      try{ parsed = JSON.parse(res.value); }
      catch(e){ return false; } // corrupte data: negeren, met lege staat verdergaan
      if(!parsed || !Array.isArray(parsed.projects)) return false;
      state.projects = parsed.projects.map(function(p){ return ensureProjectSchema(p); });
      state.activeProjectId = parsed.activeProjectId || (parsed.projects[0] && parsed.projects[0].id) || null;

      // Bijlage-inhoud die apart is opgeslagen weer terugladen.
      var loads = [];
      state.projects.forEach(function(p){
        projectThemes(p, true).forEach(function(th){
          (p.themas[th.key]||[]).forEach(function(a){
            if(a.bijlage && a.bijlage.opgeslagenApart){
              loads.push(
                storageGet(STORAGE_KEY + ':att:' + a.id).then(function(r){
                  if(r && typeof r.value === 'string'){
                    a.bijlage.inhoud = r.value;
                    delete a.bijlage.opgeslagenApart;
                    savedAttachmentSignatures[a.id] = attachmentSignature(a.bijlage);
                  } else {
                    a.bijlage.onvolledig = true;
                  }
                }).catch(function(){ a.bijlage.onvolledig = true; })
              );
            }
          });
        });
      });
      return Promise.all(loads).then(function(){ return true; });
    }).catch(function(){
      return false;
    });
  }

  function todayIso(){ return toISODate(new Date()); }

  function todayRows(){
    var today = todayIso();
    var rows = [];
    state.projects.forEach(function(project){
      projectThemes(project, true).forEach(function(th){
        (project.themas[th.key]||[]).forEach(function(a){
          if(a.status==='afgerond') return;
          if((a.deadline && a.deadline <= today) || a.prioriteitsvlag===true){
            rows.push({ project:project, theme:th, action:a });
          }
        });
      });
    });
    rows.sort(function(x,y){
      var xd=x.action.deadline||'9999-99-99', yd=y.action.deadline||'9999-99-99';
      if(xd!==yd) return xd<yd?-1:1;
      var po={hoog:1,normaal:2,laag:3};
      return (po[x.action.prioriteit||'normaal']||2)-(po[y.action.prioriteit||'normaal']||2);
    });
    return rows;
  }

      themeSel.innerHTML = '<option value="">Geen thema\'s</option>';
      sel.disabled = true; themeSel.disabled = true; titelInput.disabled = true;
      return;
    }
    sel.disabled = false; themeSel.disabled = false; titelInput.disabled = false;
    var prevValue = sel.value;
    sel.innerHTML = state.projects.map(function(p){
      return '<option value="'+p.id+'">'+escapeHtml(p.naam)+'</option>';
    }).join('');
    var candidates = [prevValue, state.activeProjectId, state.projects[0].id];
    var chosen = candidates.find(function(v){ return v && findProject(v); });
    sel.value = chosen || state.projects[0].id;
    refreshQuickAddThemes();
  }

  function refreshQuickAddThemes(){
    var projectEl = document.getElementById('qa-project');
    var themeEl = document.getElementById('qa-theme');
    if(!projectEl || !themeEl) return;
    var project = findProject(projectEl.value);
    if(!project){ themeEl.innerHTML='<option value="">Geen thema\'s</option>'; themeEl.disabled=true; return; }
    var defs = projectThemes(project, false);
    var prev = themeEl.value;
    themeEl.innerHTML = defs.length ? defs.map(function(th){ return '<option value="'+th.key+'">'+escapeHtml(th.label)+'</option>'; }).join('') : '<option value="">Geen actieve thema\'s</option>';
    themeEl.disabled = defs.length===0;
    if(defs.some(function(t){ return t.key===prev; })) themeEl.value=prev;
  }

  function quickAddAction(){
    var titleEl = document.getElementById('qa-titel');
    var projectEl = document.getElementById('qa-project');
    var themeEl = document.getElementById('qa-theme');
    if(!titleEl || !projectEl || !themeEl) return;
    if(state.projects.length===0){ alert('Maak eerst een project aan.'); return; }
    var titel = titleEl.value.trim();
    if(!titel){ titleEl.focus(); return; }
    var project = findProject(projectEl.value);
    if(!project) return;
    var themeKey = themeEl.value;
    var theme = themeMeta(project, themeKey);
    if(!themeKey || !project.themas[themeKey]){ alert('Kies eerst een actief thema voor deze actie.'); return; }
    var action = {
      id: uid('act'), titel: titel, status:'open', prioriteit:'normaal', prioriteitsvlag:false, verantwoordelijke:'', wachtenOp:'', deadline:'',
      toelichting:'', documentLabel:'', documentUrl:'', bijlage:null, subacties:[], bijgewerktOp:new Date().toISOString().slice(0,10)
    };
    project.themas[themeKey].push(action);
    titleEl.value = '';
    showToast('Actie toegevoegd aan ' + project.naam + ' / ' + theme.label + '.');
    renderAll();
    scheduleSave();
  }

  /* ============ render: hoofdgebied ============ */

  function renderContent(){
    if(state.projects.length===0){
      renderEmptyState();
    } else if(currentScreen==='overview'){
      renderOverview();
    } else if(currentScreen==='today'){
      renderToday();
    } else {
      renderMain();
    }
  }

  function renderEmptyState(){
    var content = document.getElementById('content');
    content.innerHTML = '' +
      '<div id="empty-state">' +
        '<h2>Nog geen project geselecteerd</h2>' +
        '<p>Maak een project aan om per thema acties en status bij te houden — conditionering, mobiliteit, stakeholdermanagement, BLVC, vergunningen en communicatie.</p>' +
        '<button class="btn btn-primary" data-action="new-project" style="margin-top:8px;">'+ICONS.plus+' Nieuw project</button>' +
      '</div>';
  }

  function renderToday(){
    var content = document.getElementById('content');
    var rows = todayRows();
    var today = todayIso();
    var overdue = rows.filter(function(r){ return !!r.action.deadline && r.action.deadline < today; });
    var dueToday = rows.filter(function(r){ return r.action.deadline === today; });
    var flagged = rows.filter(function(r){ return r.action.prioriteitsvlag===true && (!r.action.deadline || r.action.deadline > today); });
    var dateLabel = new Date(today+'T12:00:00').toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

    function section(title, items, emptyText){
      var html = items.length ? items.map(function(r){
        return renderActionRow(r.project.id, r.theme.key, r.action, { showTheme:true, themeLabel:r.theme.label, showProject:true, projectLabel:r.project.naam });
      }).join('') : '<div class="theme-empty" style="padding:16px 4px;">'+escapeHtml(emptyText)+'</div>';
      return '<div class="today-section-head"><h2>'+escapeHtml(title)+'</h2><span>'+items.length+' actie'+(items.length===1?'':'s')+'</span></div>' +
        '<div class="list-panel"><div class="action-list">'+html+'</div></div>';
    }

    content.innerHTML = '' +
      '<div id="project-header">' +
        '<div class="ph-top"><div class="ph-title"><h1>Vandaag</h1><div class="today-date">'+escapeHtml(dateLabel)+'</div></div><div class="toolbar-actions"><button type="button" class="add-action-plus" data-action="new-action" title="Nieuwe actie toevoegen" aria-label="Nieuwe actie toevoegen">+</button></div></div>' +
        '<div class="ph-progress"><div class="ph-stats"><div class="stat" style="font-weight:600;">'+rows.length+' actie'+(rows.length===1?'':'s')+' vraagt aandacht</div><div class="stat">'+dueToday.length+' vandaag</div><div class="stat"><span class="priority-flag-mark">'+ICONS.flag+'</span>'+flagged.length+' gevlagd</div><div class="stat"><span class="dot" style="background:var(--status-blocked-dot)"></span>'+overdue.length+' verlopen</div></div></div>' +
      '</div>' +
      '<p class="today-intro">Hier staan acties die vandaag aandacht vragen: deadlines van vandaag, achterstallige acties en acties die je zelf met een prioriteitsvlag hebt gemarkeerd. De focustimer gebruikt dezelfde selectie.</p>' +
      renderPomodoroCard() +
      section('Vandaag', dueToday, 'Geen acties met een deadline vandaag.') +
      section('Prioriteitsvlag', flagged, 'Geen extra acties met een prioriteitsvlag.') +
      section('Achterstallig', overdue, 'Geen verlopen acties.');

    refreshPomodoroActionOptions();
    updatePomodoroDisplay();
  }

  function renderOverview(){
    var content = document.getElementById('content');
    var allRows = [];
    state.projects.forEach(function(project){
      projectThemes(project, true).forEach(function(th){
        (project.themas[th.key]||[]).forEach(function(a){
          allRows.push({ project:project, theme:th, action:a });
        });
      });
    });

    var allActs = allRows.map(function(r){ return r.action; });
    var counts = countByStatus(allActs);
    var total = allActs.length;
    var progressPct = total ? Math.round(counts.afgerond/total*100) : 0;
    var stackBar = total ? STATUSES.map(function(s){
      var pct = counts[s.key]/total*100;
      if(pct<=0) return '';
      return '<span style="width:'+pct+'%;background:var('+s.dotVar+')"></span>';
    }).join('') : '<span style="width:100%;background:var(--line);"></span>';
    var stats = STATUSES.map(function(s){
      return '<div class="stat"><span class="dot" style="background:var('+s.dotVar+')"></span>'+counts[s.key]+' '+s.label.toLowerCase()+'</div>';
    }).join('');

    var chipDefs = [{ key:'alle', label:'Alle', count:allActs.length }].concat(STATUSES.map(function(s){
      return { key:s.key, label:s.label, count:counts[s.key] };
    }));
    var chips = chipDefs.map(function(c){
      var active = listFilterStatus===c.key;
      return '<button class="filter-chip'+(active?' active':'')+'" data-action="set-list-filter" data-value="'+c.key+'">'+escapeHtml(c.label)+' <span class="chip-count">'+c.count+'</span></button>';
    }).join('');

    var projectOptions = '<option value="alle">Alle projecten</option>' + state.projects.map(function(p){
      return '<option value="'+p.id+'"'+(overviewProjectFilter===p.id?' selected':'')+'>'+escapeHtml(p.naam)+'</option>';
    }).join('');

    var viewSwitch = '<div class="view-switch" role="group" aria-label="Weergave">' +
      ['lijst','kalender'].map(function(v){
        var labels = { lijst:'Lijst', kalender:'Kalender' };
        return '<button data-action="set-overview-view" data-view="'+v+'" class="'+(overviewViewMode===v?'active':'')+'">'+labels[v]+'</button>';
      }).join('') +
    '</div>';

    var toolbar = '' +
      '<div class="list-toolbar">' +
        '<div class="filter-chips">'+chips+'</div>' +
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' +
          '<input class="search-input" id="action-search" type="search" value="'+escapeHtml(listSearchTerm)+'" placeholder="Zoek actie, eigenaar, afhankelijkheid..." aria-label="Zoeken in acties">' +
          viewSwitch +
          '<select id="overview-project-select" data-action="set-overview-project-filter" aria-label="Filter op project">'+projectOptions+'</select>' +
          (overviewViewMode==='lijst' ? sortSelectHtml() + '<button type="button" class="add-action-plus" data-action="new-action" title="Nieuwe actie toevoegen" aria-label="Nieuwe actie toevoegen">+</button>' : '') +
        '</div>' +
      '</div>';

    var body = overviewViewMode==='kalender' ? renderOverviewCalendar(allRows) : renderOverviewList(allRows);

    content.innerHTML = '' +
      '<div id="project-header">' +
        '<div class="ph-top">' +
          '<div class="ph-title">' +
            '<h1>Alle acties</h1>' +
            '<div class="loc">'+state.projects.length+' project'+(state.projects.length===1?'':'en')+'</div>' +
          '</div>' +
        '</div>' +
        '<div class="ph-progress">' +
          '<div class="stack-bar">'+stackBar+'</div>' +
          '<div class="ph-stats">' +
            '<div class="stat" style="color:var(--ink-soft);font-weight:500;">'+total+' acties in totaal — '+progressPct+'% afgerond</div>' +
            stats +
          '</div>' +
        '</div>' +
      '</div>' +
      renderPomodoroCard() +
      toolbar +
      body;

    refreshPomodoroActionOptions();
    updatePomodoroDisplay();
  }

  function sortSelectHtml(){
    var sortDefs = [ {v:'deadline',l:'Op deadline'}, {v:'prioriteit',l:'Op prioriteit'}, {v:'status',l:'Op status'}, {v:'project',l:'Op project'}, {v:'thema',l:'Op thema'}, {v:'titel',l:'Op titel'} ];
    var sortOptions = sortDefs.map(function(o){
      return '<option value="'+o.v+'"'+(listSort===o.v?' selected':'')+'>'+o.l+'</option>';
    }).join('');
    return '<select id="sort-select" data-action="set-list-sort" aria-label="Sorteren">'+sortOptions+'</select>';
  }

  function renderOverviewList(allRows){
    var filtered = allRows.filter(function(r){
      if(listFilterStatus!=='alle' && r.action.status!==listFilterStatus) return false;
      if(overviewProjectFilter!=='alle' && r.project.id!==overviewProjectFilter) return false;
      if(!actionMatchesSearch(r.action, r.project.naam+' '+r.theme.label)) return false;
      return true;
    });
    filtered.sort(function(x,y){
      if(listSort==='deadline'){
        var dx = x.action.deadline || '9999-99-99';
        var dy = y.action.deadline || '9999-99-99';
        return dx<dy ? -1 : (dx>dy ? 1 : 0);
      }
      if(listSort==='prioriteit'){
        var po={hoog:1,normaal:2,laag:3};
        return (po[x.action.prioriteit||'normaal']||2)-(po[y.action.prioriteit||'normaal']||2);
      }
      if(listSort==='status'){
        var order = ['geblokkeerd','in_uitvoering','open','afgerond'];
        return order.indexOf(x.action.status) - order.indexOf(y.action.status);
      }
      if(listSort==='thema'){
        return (x.theme.label||'').localeCompare(y.theme.label||'');
      }
      if(listSort==='project'){
        return (x.project.naam||'').localeCompare(y.project.naam||'');
      }
      if(listSort==='titel'){
        return (x.action.titel||'').localeCompare(y.action.titel||'');
      }
      return 0;
    });

    var rowsHtml = filtered.length ? filtered.map(function(r){
      return renderActionRow(r.project.id, r.theme.key, r.action, { showTheme:true, themeLabel:r.theme.label, showProject:true, projectLabel:r.project.naam });
    }).join('') : '<div class="theme-empty" style="padding:18px 4px;">Geen acties gevonden.</div>';

    return '' +
      '<div class="list-panel">' +
        '<div class="action-list">'+rowsHtml+'</div>' +
      '</div>';
  }

  function renderOverviewCalendar(allRows){
    var filteredRows = allRows.filter(function(r){
      if(listFilterStatus!=='alle' && r.action.status!==listFilterStatus) return false;
      if(overviewProjectFilter!=='alle' && r.project.id!==overviewProjectFilter) return false;
      if(!actionMatchesSearch(r.action, r.project.naam+' '+r.theme.label)) return false;
      return true;
    });

    var byDate = {};
    var noDeadline = [];
    filteredRows.forEach(function(r){
      if(r.action.deadline){
        if(!byDate[r.action.deadline]) byDate[r.action.deadline] = [];
        byDate[r.action.deadline].push(r);
      } else {
        noDeadline.push(r);
      }
    });

    var grid = buildWeekdayCalendarGrid(byDate, function(r){
      var tip = r.project.naam + ' — ' + r.theme.label + ': ' + r.action.titel;
      return '<button class="cal-chip status-'+r.action.status+'" draggable="true" data-action="edit-action" data-project="'+r.project.id+'" data-theme="'+r.theme.key+'" data-id="'+r.action.id+'" title="'+escapeHtml(tip)+'">'+(r.action.prioriteitsvlag===true?'⚑ ':'')+escapeHtml(r.project.naam)+': '+escapeHtml(r.action.titel)+'</button>';
    }, '<button type="button" class="add-action-plus" data-action="new-action" title="Nieuwe actie toevoegen" aria-label="Nieuwe actie toevoegen">+</button>');

    var overflowItems = noDeadline.concat(grid.weekendItems.map(function(r){ return Object.assign({ weekend:true }, r); }));
    var overflowHtml = overflowItems.length ? (
      '<div class="cal-nodate"><h3>Zonder deadline of in het weekend ('+overflowItems.length+')</h3><div class="action-list">' +
      overflowItems.map(function(r){ return renderActionRow(r.project.id, r.theme.key, r.action, { showTheme:true, themeLabel:r.theme.label, showProject:true, projectLabel:r.project.naam }); }).join('') +
      '</div></div>'
    ) : '';

    return grid.html + overflowHtml;
  }

  function renderMain(){
    var content = document.getElementById('content');
    var p = activeProject();
    if(!p && state.projects.length){ p = state.projects[0]; state.activeProjectId = p.id; }
    if(!p){ renderEmptyState(); return; }

    var actions = allActions(p);
    var counts = countByStatus(actions);
    var total = actions.length;
    var progressPct = total ? Math.round(counts.afgerond/total*100) : 0;

    var stackBar = total ? STATUSES.map(function(s){
      var pct = counts[s.key]/total*100;
      if(pct<=0) return '';
      return '<span style="width:'+pct+'%;background:var('+s.dotVar+')"></span>';
    }).join('') : '<span style="width:100%;background:var(--line);"></span>';

    var stats = STATUSES.map(function(s){
      return '<div class="stat"><span class="dot" style="background:var('+s.dotVar+')"></span>'+counts[s.key]+' '+s.label.toLowerCase()+'</div>';
    }).join('');

    var body;
    if(viewMode==='lijst'){ body = renderViewList(p); }
    else if(viewMode==='kalender'){ body = renderViewCalendar(p); }
    else if(viewMode==='kanban'){ body = renderKanbanView(p); }
    else if(viewMode==='ontwikkeling'){ body = renderDevelopmentView(p); }
    else {
      var activeThemes = projectThemes(p, false);
      body = activeThemes.length ? '<div id="theme-grid">' + activeThemes.map(function(th){ return renderThemePanel(p, th); }).join('') + '</div>' :
        '<div class="list-panel"><div class="theme-empty" style="padding:18px 4px;">Dit project heeft nog geen actieve thema\'s. Richt het project in om te beginnen.</div><button class="theme-add" data-action="edit-project" data-id="'+p.id+'">'+ICONS.plus+' Thema\'s instellen</button></div>';
    }

    var contextBits=[];
    if(p.fase) contextBits.push('<span class="context-chip">Fase: '+escapeHtml(p.fase)+'</span>');
    if(p.opdrachtgever) contextBits.push('<span class="context-chip">Opdrachtgever: '+escapeHtml(p.opdrachtgever)+'</span>');
    if(p.startdatum || p.einddatum) contextBits.push('<span class="context-chip">'+(p.startdatum?formatDate(p.startdatum):'...')+' - '+(p.einddatum?formatDate(p.einddatum):'...')+'</span>');

    var headerColor=safeHexColor(p.headerColor,'#4B214F');
    var headerFg=contrastTextColor(headerColor);
    content.innerHTML = '' +
      '<div id="project-header" class="project-header-colored" style="--project-header-bg:'+headerColor+';--project-header-fg:'+headerFg+';">' +
        '<div class="ph-top">' +
          '<div class="ph-title">' +
            '<h1>'+escapeHtml(p.naam||'Naamloos project')+'</h1>' +
            (p.locatie ? '<div class="loc">'+escapeHtml(p.locatie)+'</div>' : '') +
            (contextBits.length ? '<div class="project-context">'+contextBits.join('')+'</div>' : '') +
          '</div>' +
          '<div class="ph-tools">' +
            renderUtilityToolButtons(p) +
            '<button class="btn" data-action="edit-project" data-id="'+p.id+'">'+ICONS.edit+' Inrichten</button>' +
            '<button class="btn" data-action="import">'+ICONS.upload+' Importeren</button>' +
            '<button class="btn" data-action="export-all">'+ICONS.download+' Exporteren</button>' +
          '</div>' +
        '</div>' +
        '<div class="ph-progress">' +
          '<div class="stack-bar">'+stackBar+'</div>' +
          '<div class="ph-stats">' +
            '<div class="stat" style="font-weight:600;">'+total+' acties in totaal — '+progressPct+'% afgerond</div>' +
            stats +
          '</div>' +
        '</div>' +
        '<div id="save-indicator">'+(storageAvailable ? '' : '')+'</div>' +
      '</div>' +
      renderProjectLayout(p, body);

    initProjectModules(p);
  }

  function renderViewList(project){
    var rows = [];
    projectThemes(project, false).forEach(function(th){
      (project.themas[th.key]||[]).forEach(function(a){ rows.push({ theme: th, action: a }); });
    });
    if(listFilterStatus !== 'alle'){
      rows = rows.filter(function(r){ return r.action.status===listFilterStatus; });
    }
    rows = rows.filter(function(r){ return actionMatchesSearch(r.action, r.theme.label); });
    rows.sort(function(x,y){
      if(listSort==='deadline'){
        var dx = x.action.deadline || '9999-99-99';
        var dy = y.action.deadline || '9999-99-99';
        return dx<dy ? -1 : (dx>dy ? 1 : 0);
      }
      if(listSort==='prioriteit'){
        var po={hoog:1,normaal:2,laag:3};
        return (po[x.action.prioriteit||'normaal']||2)-(po[y.action.prioriteit||'normaal']||2);
      }
      if(listSort==='status'){
        var order = ['geblokkeerd','in_uitvoering','open','afgerond'];
        return order.indexOf(x.action.status) - order.indexOf(y.action.status);
      }
      if(listSort==='thema'){
        var keys = projectThemes(project, true).map(function(t){ return t.key; });
        return keys.indexOf(x.theme.key) - keys.indexOf(y.theme.key);
      }
      if(listSort==='titel'){
        return (x.action.titel||'').localeCompare(y.action.titel||'');
      }
      return 0;
    });

    var allActs = allActions(project);
    var counts = countByStatus(allActs);
    var chipDefs = [{ key:'alle', label:'Alle', count:allActs.length }].concat(STATUSES.map(function(s){
      return { key:s.key, label:s.label, count:counts[s.key] };
    }));
    var chips = chipDefs.map(function(c){
      var active = listFilterStatus===c.key;
      return '<button class="filter-chip'+(active?' active':'')+'" data-action="set-list-filter" data-value="'+c.key+'">'+escapeHtml(c.label)+' <span class="chip-count">'+c.count+'</span></button>';
    }).join('');

    var sortDefs = [ {v:'deadline',l:'Op deadline'}, {v:'prioriteit',l:'Op prioriteit'}, {v:'status',l:'Op status'}, {v:'thema',l:'Op thema'}, {v:'titel',l:'Op titel'} ];
    var sortOptions = sortDefs.map(function(o){
      return '<option value="'+o.v+'"'+(listSort===o.v?' selected':'')+'>'+o.l+'</option>';

        '<div class="action-list">'+rowsHtml+'</div>' +
