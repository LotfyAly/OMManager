  function renderKanbanView(project){
    var themes = projectThemes(project, true);
    var rows=[];
    themes.forEach(function(th){
      (project.themas[th.key]||[]).forEach(function(a){
        if(!actionMatchesSearch(a, th.label)) return;
        rows.push({project:project, theme:th, action:a});
      });
    });
    var search = '<div class="list-toolbar"><div><strong style="font-size:13px;">Acties per status</strong><div style="font-size:11.5px;color:var(--ink-faint);margin-top:2px;">Sleep een kaart naar een andere kolom of wijzig de status in de kaart.</div></div><div class="toolbar-actions"><input class="search-input" id="action-search" type="search" value="'+escapeHtml(listSearchTerm)+'" placeholder="Zoek in acties..." aria-label="Zoeken in acties"><button type="button" class="add-action-plus" data-action="new-action" data-project="'+project.id+'" title="Nieuwe actie toevoegen" aria-label="Nieuwe actie toevoegen">+</button></div></div>';
    var columns = STATUSES.map(function(st){
      var items = rows.filter(function(r){ return r.action.status===st.key; });
      var cards = items.length ? items.map(function(r){ return renderKanbanCard(r.project, r.theme, r.action); }).join('') : '<div class="kanban-empty">Geen acties</div>';
      return '<section class="kanban-column" data-kanban-status="'+st.key+'">' +
        '<div class="kanban-head"><span class="dot" style="background:var('+st.dotVar+')"></span>'+escapeHtml(st.label)+'<span class="kanban-count">'+items.length+'</span></div>' +
        '<div class="kanban-cards">'+cards+'</div>' +
      '</section>';
    }).join('');
    return search + '<div class="kanban-board" aria-label="Kanbanbord voor '+escapeHtml(project.naam)+'">'+columns+'</div>';
  }

  function renderKanbanCard(project, theme, a){
    var overdue = isOverdue(a.deadline, a.status);
    var opts = STATUSES.map(function(st){ return '<option value="'+st.key+'"'+(st.key===a.status?' selected':'')+'>'+escapeHtml(st.label)+'</option>'; }).join('');
    var meta=[];
    meta.push('<span class="theme-badge">'+escapeHtml(theme.label)+'</span>');
    if(a.prioriteit==='hoog') meta.push('<span class="priority-badge priority-hoog">Hoge prioriteit</span>');
    if(a.verantwoordelijke) meta.push('<span>'+ICONS.person+' '+escapeHtml(a.verantwoordelijke)+'</span>');
    if(a.deadline) meta.push('<span class="'+(overdue?'overdue':'')+'">'+ICONS.calendar+' '+formatDate(a.deadline)+(overdue?' · verlopen':'')+'</span>');
    if(a.wachtenOp) meta.push('<span>Wacht op: '+escapeHtml(truncateText(a.wachtenOp,38))+'</span>');
    return '<article class="kanban-card status-'+a.status+'" draggable="true" data-project="'+project.id+'" data-theme="'+theme.key+'" data-id="'+a.id+'">' +
      '<div class="kanban-card-title">'+(a.prioriteitsvlag===true?'<span class="priority-flag-mark">'+ICONS.flag+'</span> ':'')+escapeHtml(a.titel||'(geen titel)')+'</div>' +
      '<div class="kanban-card-meta">'+meta.join('')+'</div>' +
      renderSubactionSummary(project.id,theme.key,a) +
      '<div class="kanban-card-bottom">' +
        '<select class="status-select status-'+a.status+'" data-action="change-status" data-project="'+project.id+'" data-theme="'+theme.key+'" data-id="'+a.id+'" aria-label="Status van '+escapeHtml(a.titel)+'">'+opts+'</select>' +
        '<button type="button" class="action-icon kanban-edit" data-action="edit-action" data-project="'+project.id+'" data-theme="'+theme.key+'" data-id="'+a.id+'" title="Bewerken" aria-label="Actie bewerken">'+ICONS.edit+'</button>' +
      '</div>' +
    '</article>';
  }

  function renderViewCalendar(project){
    var byDate = {};
    var noDeadline = [];
    projectThemes(project, false).forEach(function(th){
      (project.themas[th.key]||[]).forEach(function(a){
        if(listFilterStatus!=='alle' && a.status!==listFilterStatus) return;
        if(!actionMatchesSearch(a, th.label)) return;
        if(a.deadline){
          if(!byDate[a.deadline]) byDate[a.deadline] = [];
          byDate[a.deadline].push({ project:project, theme:th, action:a });
        } else {
          noDeadline.push({ project:project, theme:th, action:a });
        }
      });
    });

    var grid = buildWeekdayCalendarGrid(byDate, function(it){
      return '<button class="cal-chip status-'+it.action.status+'" draggable="true" data-action="edit-action" data-project="'+project.id+'" data-theme="'+it.theme.key+'" data-id="'+it.action.id+'" title="'+escapeHtml(it.action.titel)+'">'+(it.action.prioriteitsvlag===true?'⚑ ':'')+escapeHtml(it.action.titel)+'</button>';
    }, '<button type="button" class="add-action-plus" data-action="new-action" data-project="'+project.id+'" title="Nieuwe actie toevoegen" aria-label="Nieuwe actie toevoegen">+</button>');

    var overflowItems = noDeadline.concat(grid.weekendItems);
    var overflowHtml = overflowItems.length ? (
      '<div class="cal-nodate"><h3>Zonder deadline of in het weekend ('+overflowItems.length+')</h3><div class="action-list">' +
      overflowItems.map(function(it){ return renderActionRow(project.id, it.theme.key, it.action, { showTheme:true, themeLabel:it.theme.label }); }).join('') +
      '</div></div>'
    ) : '';

    var allActs=allActions(project);
    var counts=countByStatus(allActs);
    var chipDefs=[{key:'alle',label:'Alle',count:allActs.length}].concat(STATUSES.map(function(st){ return {key:st.key,label:st.label,count:counts[st.key]}; }));
    var chips=chipDefs.map(function(c){ return '<button class="filter-chip'+(listFilterStatus===c.key?' active':'')+'" data-action="set-list-filter" data-value="'+c.key+'">'+escapeHtml(c.label)+' <span class="chip-count">'+c.count+'</span></button>'; }).join('');
    var toolbar='<div class="list-toolbar"><div class="filter-chips">'+chips+'</div><input class="search-input" id="action-search" type="search" value="'+escapeHtml(listSearchTerm)+'" placeholder="Zoek in acties..." aria-label="Zoeken in acties"></div>';
    return toolbar + grid.html + overflowHtml;
  }

  function renderThemeMilestones(project, theme){
    ensureProjectSchema(project);
    var items=(project.themeMilestones[theme.key]||[]).slice().sort(function(a,b){
      var ad=a.datum||'9999-99-99', bd=b.datum||'9999-99-99';
      if(a.status==='behaald' && b.status!=='behaald') return 1;
      if(a.status!=='behaald' && b.status==='behaald') return -1;
      return ad.localeCompare(bd);
    });
    var today=todayIso();
    var rows=items.map(function(m){
      var overdue=!!(m.datum && m.datum<today && m.status!=='behaald');
      var done=m.status==='behaald';
      var typeLabel=m.type==='deadline'?'Deadline':'Mijlpaal';
      return '<div class="theme-milestone-row'+(overdue?' overdue':'')+(done?' done':'')+'" data-action="edit-theme-milestone" data-project="'+project.id+'" data-theme="'+theme.key+'" data-id="'+m.id+'" title="Klik om te bewerken">'+
        '<span class="theme-milestone-date">'+escapeHtml(m.datum?formatDate(m.datum):'Geen datum')+'</span>'+
        '<span class="theme-milestone-type">'+typeLabel+'</span>'+
        '<span class="theme-milestone-title">'+escapeHtml(m.titel)+'</span>'+
        (done?'<span class="theme-milestone-status">Behaald</span>':'')+
      '</div>';
    }).join('');
    return '<div class="theme-milestones">'+
      '<div class="theme-milestones-head"><strong>Belangrijke mijlpalen & deadlines</strong><span class="theme-milestones-count">'+items.length+'</span>'+
      '<button type="button" class="add-action-plus theme-milestones-add" data-action="new-theme-milestone" data-project="'+project.id+'" data-theme="'+theme.key+'" title="Mijlpaal of deadline toevoegen" aria-label="Mijlpaal of deadline toevoegen">+</button></div>'+
      '<div class="theme-milestones-list">'+(rows||'<div class="theme-milestone-empty">Nog geen belangrijke mijlpalen of deadlines.</div>')+'</div>'+
    '</div>';
  }

  function renderThemePanel(project, theme){
    var list = project.themas[theme.key] || [];
    var counts = countByStatus(list);
    var total = list.length;
    var bar = total ? STATUSES.map(function(s){
      var pct = counts[s.key]/total*100;
      if(pct<=0) return '';
      return '<span style="width:'+pct+'%;background:var('+s.dotVar+')"></span>';
    }).join('') : '';

    var rows = list.length ? list.map(function(a){ return renderActionRow(project.id, theme.key, a); }).join('')
      : '<div class="theme-empty">Nog geen acties in dit thema.</div>';

    var ts = getThemaStatus(project, theme.key);
    var tsMeta = themaStatusMeta(ts.status);

    var linkChips = renderStatusLinks(ts.links, false);
    var preview = ts.tekst ? escapeHtml(ts.tekst) : '<span class="tp-status-empty">Geen toelichting — klik om toe te voegen</span>';
    var updated = ts.bijgewerktOp ? '<span class="tp-status-updated">Bijgewerkt '+escapeHtml(formatDateTime(ts.bijgewerktOp))+'</span>' : '';
    var historyHtml = renderThemeHistory(project, theme.key, false);

    return '' +
      '<section class="theme-panel">' +
        (total ? '<div class="stack-bar theme-status-strip" title="Verdeling actiestatussen binnen dit thema">'+bar+'</div>' : '<div class="stack-bar theme-status-strip theme-status-strip-empty" title="Nog geen acties in dit thema"></div>') +
        '<div class="tp-head">' +
          '<div>' +
            '<h3><span class="tp-status-dot" style="background:var('+tsMeta.dotVar+')" title="'+escapeHtml(tsMeta.label)+'"></span>'+escapeHtml(theme.label)+'</h3>' +
            '<div class="tp-desc">'+escapeHtml(theme.desc)+'</div>' +
          '</div>' +
          '<div class="tp-head-actions"><div class="tp-count">'+total+'</div><button type="button" class="add-action-plus" data-action="new-action" data-project="'+project.id+'" data-theme="'+theme.key+'" title="Actie toevoegen aan '+escapeHtml(theme.label)+'" aria-label="Actie toevoegen aan '+escapeHtml(theme.label)+'">+</button></div>' +
        '</div>' +
        renderThemeMilestones(project, theme) +
        '<div class="tp-status-bar status-'+ts.status+'" data-action="edit-thema-status" data-project="'+project.id+'" data-theme="'+theme.key+'">' +
          '<div class="tp-status-main">' +
            '<div class="tp-status-topline"><span class="tp-status-pill">'+escapeHtml(tsMeta.label)+'</span>'+updated+'</div>' +
            '<div class="tp-status-preview">'+preview+'</div>' +
            (linkChips ? '<div class="tp-status-links">'+linkChips+'</div>' : '') +
          '</div>' +
          '<span class="tp-status-editbtn" title="Status aanpassen">'+ICONS.edit+'</span>' +
        '</div>' +
        historyHtml +
        '<div class="action-list">'+rows+'</div>' +
      '</section>';
  }

  function subactionCounts(a){
    return countByStatus((a && a.subacties)||[]);
  }

  function renderSubactionSummary(projectId, themeKey, a){
    var subs=a.subacties||[];
    if(!subs.length) return '';
    var counts=subactionCounts(a), total=subs.length;
    var badges=STATUSES.filter(function(st){ return counts[st.key]>0; }).map(function(st){
      return '<span class="subaction-count"><span class="dot" style="background:var('+st.dotVar+')"></span>'+counts[st.key]+' '+escapeHtml(st.label.toLowerCase())+'</span>';
    }).join('');
    var progress=STATUSES.map(function(st){
      var pct=counts[st.key]/total*100;
      return pct>0 ? '<span style="width:'+pct+'%;background:var('+st.dotVar+')"></span>' : '';
    }).join('');
    return '<div class="subaction-summary"><span class="subaction-summary-label">'+total+' subactie'+(total===1?'':'s')+'</span>'+badges+'<span class="subaction-progress" title="Verdeling subactiestatussen">'+progress+'</span></div>';
  }

  function renderSubactionRows(projectId, themeKey, a){
    var subs=a.subacties||[];
    if(!subs.length) return '';
    return '<div class="subaction-list">'+subs.map(function(sa){
      var overdue=isOverdue(sa.deadline,sa.status);
      var opts=STATUSES.map(function(st){ return '<option value="'+st.key+'"'+(st.key===sa.status?' selected':'')+'>'+escapeHtml(st.label)+'</option>'; }).join('');
      var meta=[];
      if(sa.verantwoordelijke) meta.push('<span>'+ICONS.person+' '+escapeHtml(sa.verantwoordelijke)+'</span>');
      if(sa.deadline) meta.push('<span class="'+(overdue?'overdue':'')+'">'+ICONS.calendar+' '+formatDate(sa.deadline)+(overdue?' — verlopen':'')+'</span>');
      if(sa.wachtenOp) meta.push('<span class="waiting-meta">Wacht op: '+escapeHtml(sa.wachtenOp)+'</span>');
      return '<div class="subaction-row" data-project="'+projectId+'" data-theme="'+themeKey+'" data-parent="'+a.id+'" data-id="'+sa.id+'">'+
        '<select class="status-select status-'+sa.status+'" data-action="change-subaction-status" data-project="'+projectId+'" data-theme="'+themeKey+'" data-parent="'+a.id+'" data-id="'+sa.id+'" aria-label="Status van subactie '+escapeHtml(sa.titel)+'">'+opts+'</select>'+
        '<div class="subaction-main"><div class="subaction-title">'+escapeHtml(sa.titel||'(geen titel)')+'</div>'+(meta.length?'<div class="subaction-meta">'+meta.join('')+'</div>':'')+'</div>'+
        '<div class="subaction-actions"><button type="button" class="action-icon" data-action="edit-subaction" data-project="'+projectId+'" data-theme="'+themeKey+'" data-parent="'+a.id+'" data-id="'+sa.id+'" title="Subactie bewerken">'+ICONS.edit+'</button><button type="button" class="action-icon" data-action="delete-subaction" data-project="'+projectId+'" data-theme="'+themeKey+'" data-parent="'+a.id+'" data-id="'+sa.id+'" title="Subactie verwijderen">'+ICONS.trash+'</button></div>'+
      '</div>';
    }).join('')+'</div>';
  }

  function renderActionRow(projectId, themeKey, a, opts){
    opts = opts || {};
    if(!Array.isArray(a.subacties)) a.subacties=[];
    var overdue = isOverdue(a.deadline, a.status);
    var selectOptions = STATUSES.map(function(s){
      return '<option value="'+s.key+'"'+(s.key===a.status?' selected':'')+'>'+s.label+'</option>';
    }).join('');

    var metaBits = [];
    if(opts.showProject && opts.projectLabel){ metaBits.push('<span class="project-badge">'+escapeHtml(opts.projectLabel)+'</span>'); }
    if(opts.showTheme && opts.themeLabel){ metaBits.push('<span class="theme-badge">'+escapeHtml(opts.themeLabel)+'</span>'); }
    if(a.prioriteit && a.prioriteit!=='normaal'){ metaBits.push('<span class="priority-badge priority-'+escapeHtml(a.prioriteit)+'">'+(a.prioriteit==='hoog'?'Hoge prioriteit':'Lage prioriteit')+'</span>'); }
    if(a.verantwoordelijke){ metaBits.push('<span>'+ICONS.person+' '+escapeHtml(a.verantwoordelijke)+'</span>'); }
    if(a.wachtenOp){ metaBits.push('<span class="waiting-meta">Wacht op: '+escapeHtml(a.wachtenOp)+'</span>'); }
    var documentHref = safeDocumentUrl(a.documentUrl);
    if(documentHref){
      metaBits.push('<a class="row-attachment action-document-link" href="'+escapeHtml(documentHref)+'" target="_blank" rel="noopener noreferrer" title="Document openen">'+ICONS.link+' '+escapeHtml(truncateText(a.documentLabel||'Document',24))+'</a>');
    }
    if(a.bijlage){
      var attTitle = a.bijlage.onvolledig ? (a.bijlage.naam+' — kon niet volledig geladen worden, open om opnieuw te koppelen') : (a.bijlage.naam+' downloaden');
      metaBits.push('<button type="button" class="row-attachment'+(a.bijlage.onvolledig?' row-attachment-warning':'')+'" data-action="download-attachment" data-project="'+projectId+'" data-theme="'+themeKey+'" data-id="'+a.id+'" title="'+escapeHtml(attTitle)+'">'+ICONS.paperclip+' '+escapeHtml(truncateText(a.bijlage.naam,20))+'</button>');
    }
    if(a.deadline){ metaBits.push('<span class="'+(overdue?'overdue':'')+'">'+ICONS.calendar+' '+formatDate(a.deadline)+(overdue?' — verlopen':'')+'</span>'); }

    return '<div class="action-group">' +
      '<div class="action-row" data-project="'+projectId+'" data-theme="'+themeKey+'" data-id="'+a.id+'">' +
        '<select class="status-select status-'+a.status+'" data-action="change-status" data-project="'+projectId+'" data-theme="'+themeKey+'" data-id="'+a.id+'" aria-label="Status van '+escapeHtml(a.titel)+'">'+selectOptions+'</select>' +
        '<div class="row-main">' +
          '<div class="row-title row-title-open" data-action="edit-action" data-project="'+projectId+'" data-theme="'+themeKey+'" data-id="'+a.id+'" title="Actie openen">'+(a.prioriteitsvlag===true?'<span class="priority-flag-mark" title="Prioriteitsvlag">'+ICONS.flag+'</span>':'')+escapeHtml(a.titel||'(geen titel)')+'</div>' +
          (metaBits.length ? '<div class="row-meta">'+metaBits.join('')+'</div>' : '') +
          renderSubactionSummary(projectId,themeKey,a) +
        '</div>' +
        '<div class="row-actions">' +
          '<button class="action-icon" data-action="edit-action" data-project="'+projectId+'" data-theme="'+themeKey+'" data-id="'+a.id+'" title="Bewerken" aria-label="Actie bewerken">'+ICONS.edit+'</button>' +
          '<button class="action-icon" data-action="delete-action" data-project="'+projectId+'" data-theme="'+themeKey+'" data-id="'+a.id+'" title="Verwijderen" aria-label="Actie verwijderen">'+ICONS.trash+'</button>' +
        '</div>' +
      '</div></div>';
  }

    document.querySelectorAll('.theme-panel .theme-add, .theme-panel > button[data-action="new-action"]:not(.add-action-plus)').forEach(function(el){ el.remove(); });
  }

    renderSidebar();

    renderUtilityPlugin();
    removeLegacyThemeAddButtons();
  }

  /* ============ modals ============ */

  function closeModal(){
    actionModalAutosave = null;
    document.getElementById('modal-root').innerHTML = '';
    renderAll();

  function makeThemeKey(label, existing){
    var base = String(label||'thema').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,36) || 'thema';
    var key=base, i=2;
    while(existing.indexOf(key)!==-1){ key=base+'_'+i; i++; }
    return key;
  }

  function openProjectModal(projectId){
    var editing = projectId ? ensureProjectSchema(findProject(projectId)) : null;
    var workingThemeConfig = editing ? JSON.parse(JSON.stringify(projectThemes(editing,true))) : defaultThemeConfig('basis');
    var workingModuleConfig = editing ? Object.assign({},editing.moduleConfig) : {};
    var workingLayoutOrder = editing && Array.isArray(editing.layoutOrder) ? editing.layoutOrder.slice() : DEFAULT_LAYOUT_ORDER.slice();
    DEFAULT_LAYOUT_ORDER.forEach(function(k){ if(workingLayoutOrder.indexOf(k)===-1) workingLayoutOrder.push(k); });
    workingLayoutOrder=workingLayoutOrder.filter(function(k,i,arr){ return DEFAULT_LAYOUT_ORDER.indexOf(k)!==-1 && arr.indexOf(k)===i; });
    MODULE_CATALOG.forEach(function(m){ if(workingModuleConfig[m.key]===undefined) workingModuleConfig[m.key]=m.defaultEnabled!==false; });

    var phaseOptions = '<option value="">Nog niet gekozen</option>' + PROJECT_PHASES.map(function(ph){
      return '<option value="'+escapeHtml(ph)+'"'+(editing && editing.fase===ph?' selected':'')+'>'+escapeHtml(ph)+'</option>';
    }).join('');
    var templateHtml = editing ? '' : (
      '<div class="field"><label for="pf-template">Startinrichting</label><select id="pf-template">' +
        '<option value="basis">Basis omgevingsmanagement</option>' +
        '<option value="uitvoering">Uitvoering / BLVC</option>' +
        '<option value="kl">Kabels & leidingen</option>' +
        '<option value="volledig">Alle standaardthema\'s</option>' +
        '<option value="leeg">Leeg project</option>' +
      '</select></div>'
    );
    var moduleHtml = MODULE_CATALOG.map(function(m){
      var checked = workingModuleConfig[m.key]!==false ? ' checked' : '';
      return '<label><input type="checkbox" data-module-key="'+m.key+'"'+checked+'><div><strong>'+escapeHtml(m.label)+'</strong><span>'+escapeHtml(m.desc)+'</span></div></label>';
    }).join('');

    var root = document.getElementById('modal-root');
    root.innerHTML = '' +
      '<div class="modal-overlay" data-action="overlay-close">' +
        '<div class="modal modal-wide" role="dialog" aria-modal="true" aria-label="'+(editing?'Project inrichten':'Nieuw project')+'">' +
          '<div class="modal-head"><h2>'+(editing?'Project inrichten':'Nieuw project')+'</h2>' +
            '<button class="action-icon" data-action="close-modal" aria-label="Sluiten">'+ICONS.close+'</button></div>' +
          '<form id="project-form" novalidate>' +
            '<div class="field-row">' +
              '<div class="field"><label for="pf-naam">Naam</label>' +
                '<input id="pf-naam" value="'+(editing?escapeHtml(editing.naam):'')+'" placeholder="Bijv. N247 Randweg - fase 2">' +
                '<div class="field-error">Vul een naam in voor het project.</div></div>' +
              '<div class="field"><label for="pf-fase">Projectfase</label><select id="pf-fase">'+phaseOptions+'</select></div>' +
            '</div>' +
            '<div class="field-row">' +
              '<div class="field"><label for="pf-locatie">Locatie</label><input id="pf-locatie" value="'+(editing?escapeHtml(editing.locatie||''):'')+'" placeholder="Gemeente / werkgebied"></div>' +
              '<div class="field"><label for="pf-opdrachtgever">Opdrachtgever</label><input id="pf-opdrachtgever" value="'+(editing?escapeHtml(editing.opdrachtgever||''):'')+'" placeholder="Organisatie"></div>' +
            '</div>' +
            '<div class="field-row">' +
              '<div class="field"><label for="pf-startdatum">Startdatum</label><input id="pf-startdatum" type="date" value="'+(editing?editing.startdatum||'':'')+'"></div>' +
              '<div class="field"><label for="pf-einddatum">Einddatum</label><input id="pf-einddatum" type="date" value="'+(editing?editing.einddatum||'':'')+'"></div>' +
              '<div class="field"><label for="pf-headerkleur">Headerkleur</label><input id="pf-headerkleur" class="project-color-input" type="color" value="'+safeHexColor(editing&&editing.headerColor,'#4B214F')+'"></div>' +
            '</div>' +
            templateHtml +
            '<div class="config-section">' +
              '<h3>Thema\'s voor dit project</h3>' +
              '<div class="config-help">Activeer alleen wat voor dit project relevant is. Volgorde kun je per project aanpassen. Thema\'s met acties kunnen niet worden uitgezet.</div>' +
              '<div id="theme-config-list" class="theme-config-list"></div>' +
              '<div class="custom-theme-add">' +
                '<input id="custom-theme-label" type="text" placeholder="Nieuw thema">' +
                '<input id="custom-theme-desc" type="text" placeholder="Korte omschrijving (optioneel)">' +
                '<button type="button" class="btn" data-config-action="add-custom-theme">'+ICONS.plus+' Toevoegen</button>' +
              '</div>' +
            '</div>' +
            '<div class="config-section">' +
              '<h3>Modules</h3>' +
              '<div class="config-help">Modules zijn projectgebonden. Zet hier aan wat je in dit project wilt gebruiken.</div>' +

    function normalizeWorkingOrder(){
      workingThemeConfig.sort(function(a,b){ return (a.order||0)-(b.order||0); });
      workingThemeConfig.forEach(function(t,i){ t.order=i; });
    }
    function renderThemeEditor(){
      normalizeWorkingOrder();
      var host=document.getElementById('theme-config-list');
      if(!host) return;
      host.innerHTML = workingThemeConfig.map(function(th,idx){
        var actionCount = editing && editing.themas && editing.themas[th.key] ? editing.themas[th.key].length : 0;
        var checked = th.active!==false ? ' checked' : '';
        return '<div class="theme-config-row'+(th.active===false?' inactive':'')+'" data-config-theme="'+th.key+'">' +
          '<input type="checkbox" data-config-toggle="'+th.key+'"'+checked+' aria-label="Thema activeren">' +
          '<div><div class="theme-config-title">'+escapeHtml(th.label)+(actionCount?' <span class="chip-count">('+actionCount+' acties)</span>':'')+'</div>' +

  function normalizeBulkHeader(value){
    return String(value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-z0-9]+/g,' ').trim();
  }

  function bulkHeaderKey(value){
    var h=normalizeBulkHeader(value);
    var map={
      'actie':'titel','acties':'titel','subactie':'titel','subacties':'titel','titel':'titel','taak':'titel','task':'titel','onderwerp':'titel',
      'verantwoordelijke':'verantwoordelijke','eigenaar':'verantwoordelijke','owner':'verantwoordelijke','wie':'verantwoordelijke',
      'deadline':'deadline','datum':'deadline','einddatum':'deadline','due date':'deadline','due':'deadline',
      'status':'status','stand':'status',
      'prioriteit':'prioriteit','priority':'prioriteit','prio':'prioriteit',
      'toelichting':'toelichting','omschrijving':'toelichting','context':'toelichting','notitie':'toelichting','notities':'toelichting',
      'wachten op':'wachtenOp','afhankelijk van':'wachtenOp','afhankelijkheid':'wachtenOp','dependency':'wachtenOp',
      'documentnaam':'documentLabel','document naam':'documentLabel','document':'documentLabel','bestandsnaam':'documentLabel',
      'documentlink':'documentUrl','document link':'documentUrl','link':'documentUrl','url':'documentUrl'
    };
    return map[h] || '';
  }

  function splitBulkRow(line, delimiter){
    if(delimiter==='|'){
      line=line.trim();
      if(line.charAt(0)==='|') line=line.slice(1);
      if(line.charAt(line.length-1)==='|') line=line.slice(0,-1);
    }
    return line.split(delimiter).map(function(cell){ return cell.trim(); });
  }

  function parseBulkDate(value){
    var v=String(value||'').trim();
    if(!v) return '';
    var m;
    if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
    m=v.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/);
    if(m){
      var d=Number(m[1]), mo=Number(m[2]), y=Number(m[3]);
      var test=new Date(y,mo-1,d);
      if(test.getFullYear()===y && test.getMonth()===mo-1 && test.getDate()===d){
        return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      }
    }
    return '';
  }

  function parseBulkStatus(value){
    var v=normalizeBulkHeader(value).replace(/ /g,'_');
    if(!v) return 'open';
    if(['open','nieuw','todo','te_doen'].indexOf(v)!==-1) return 'open';
    if(['in_uitvoering','uitvoering','bezig','in_progress','lopend'].indexOf(v)!==-1) return 'in_uitvoering';
    if(['afgerond','gereed','klaar','done','voltooid'].indexOf(v)!==-1) return 'afgerond';
    if(['vervallen','geblokkeerd','blocked','blok','on_hold','wacht'].indexOf(v)!==-1) return 'geblokkeerd';
    return 'open';
  }

  function parseBulkPriority(value){
    var v=normalizeBulkHeader(value);
    if(['hoog','hoge','high','urgent'].indexOf(v)!==-1) return 'hoog';
    if(['laag','lage','low'].indexOf(v)!==-1) return 'laag';
    return 'normaal';
  }

  function parseBulkTable(text){
    var rawLines=String(text||'').replace(/\r/g,'').split('\n').filter(function(line){ return line.trim(); });
    if(!rawLines.length) return {items:[],warnings:[],hasHeader:false};
    var delimiter='\t';
    if(rawLines.some(function(l){ return l.indexOf('\t')!==-1; })) delimiter='\t';
    else if(rawLines.some(function(l){ return l.indexOf('|')!==-1; })) delimiter='|';
    else if(rawLines.some(function(l){ return l.indexOf(';')!==-1; })) delimiter=';';
    else delimiter=null;

    var rows=rawLines.map(function(line){ return delimiter ? splitBulkRow(line,delimiter) : [line.trim()]; });
    if(delimiter==='|'){
      rows=rows.filter(function(row){
        return !row.length || !row.every(function(cell){ return /^:?-{3,}:?$/.test(cell.replace(/\s/g,'')); });
      });
    }
    if(!rows.length) return {items:[],warnings:[],hasHeader:false};

    var mapped=rows[0].map(bulkHeaderKey);
    var hasHeader=mapped.some(function(k){ return !!k; });
    var keys;
    if(hasHeader){
      keys=mapped;
      rows=rows.slice(1);
    } else {
      keys=['titel','deadline','verantwoordelijke','status','prioriteit','toelichting','wachtenOp','documentLabel','documentUrl'];
    }

    var warnings=[];
    var items=[];
    rows.forEach(function(row,rowIndex){
      var obj={ titel:'',deadline:'',verantwoordelijke:'',status:'open',prioriteit:'normaal',toelichting:'',wachtenOp:'',documentLabel:'',documentUrl:'' };
      row.forEach(function(cell,i){
        var key=keys[i];
        if(key) obj[key]=cell;
      });
      obj.titel=String(obj.titel||'').trim().slice(0,200);
      if(!obj.titel){ warnings.push('Rij '+(rowIndex+(hasHeader?2:1))+': geen subactietitel, overgeslagen.'); return; }
      var rawDeadline=obj.deadline;
      obj.deadline=parseBulkDate(rawDeadline);
      if(rawDeadline && !obj.deadline) warnings.push('“'+obj.titel+'”: deadline “'+rawDeadline+'” niet herkend en leeg gelaten.');
      obj.status=parseBulkStatus(obj.status);
      obj.prioriteit=parseBulkPriority(obj.prioriteit);
      obj.verantwoordelijke=String(obj.verantwoordelijke||'').trim();
      obj.toelichting=String(obj.toelichting||'').trim();
      obj.wachtenOp=String(obj.wachtenOp||'').trim();
      obj.documentLabel=String(obj.documentLabel||'').trim();
      var rawUrl=String(obj.documentUrl||'').trim();
      obj.documentUrl=normalizeDocumentUrl(rawUrl);
      if(rawUrl && !safeDocumentUrl(obj.documentUrl)){
        warnings.push('“'+obj.titel+'”: documentlink niet geldig en leeg gelaten.');
        obj.documentUrl='';
      }
      items.push(obj);
    });
    return {items:items,warnings:warnings,hasHeader:hasHeader};
  }

  function renderBulkPreview(parsed){
    var host=document.getElementById('bulk-preview');
    var submit=document.getElementById('bulk-submit');
    if(!host) return;
    if(!parsed.items.length){
      host.innerHTML='<div class="bulk-preview-empty">Plak hierboven een tabel om een voorbeeld te zien.</div>';
      if(submit) submit.disabled=true;
      return;
    }
    var rows=parsed.items.slice(0,10).map(function(a){
      return '<tr><td>'+escapeHtml(a.titel)+'</td><td>'+escapeHtml(a.deadline?formatDate(a.deadline):'—')+'</td><td>'+escapeHtml(a.verantwoordelijke||'—')+'</td><td>'+escapeHtml(statusMeta(a.status).label)+'</td><td>'+escapeHtml(a.prioriteit==='hoog'?'Hoog':a.prioriteit==='laag'?'Laag':'Normaal')+'</td></tr>';
    }).join('');
    var warningText=parsed.warnings.length ? '<span class="bulk-warning">'+parsed.warnings.length+' waarschuwing'+(parsed.warnings.length===1?'':'en')+'</span>' : '<span>Geen waarschuwingen</span>';
    host.innerHTML='<div class="bulk-preview-summary"><strong>'+parsed.items.length+' subactie'+(parsed.items.length===1?'':'s')+' herkend</strong>'+warningText+'</div>'+
      '<table><thead><tr><th>Subactie</th><th>Deadline</th><th>Verantwoordelijke</th><th>Status</th><th>Prioriteit</th></tr></thead><tbody>'+rows+'</tbody></table>'+
      (parsed.items.length>10?'<div class="bulk-preview-empty">Voorbeeld toont de eerste 10 van '+parsed.items.length+' subacties.</div>':'')+
      (parsed.warnings.length?'<div class="bulk-preview-empty bulk-warning">'+parsed.warnings.slice(0,4).map(escapeHtml).join('<br>')+(parsed.warnings.length>4?'<br>…':'')+'</div>':'');
    if(submit) submit.disabled=false;
  }

  function findSubaction(projectId, themeKey, parentId, subId){
    var project=findProject(projectId);
    if(!project) return null;
    var parent=(project.themas[themeKey]||[]).find(function(a){ return a.id===parentId; });
    if(!parent) return null;
    if(!Array.isArray(parent.subacties)) parent.subacties=[];
    var sub=parent.subacties.find(function(sa){ return sa.id===subId; }) || null;
    return { project:project, parent:parent, subaction:sub };
  }

        themeSelect.innerHTML = defs.map(function(th){ return '<option value="'+th.key+'">'+escapeHtml(th.label)+'</option>'; }).join('');
      });

    var autosaveStatus=document.getElementById('af-autosave-status');
    var savedAction=editing || null;
    var savedProject=editing ? p : null;
    var savedTheme=editing ? themeKey : null;

    function setActionAutosaveStatus(text,stateClass){
      if(!autosaveStatus) return;
      autosaveStatus.textContent=text;
      autosaveStatus.className='action-autosave-status'+(stateClass?' '+stateClass:'');
    }

    function currentActionTarget(){
      var targetProject=needsProjectPicker ? (findProject(document.getElementById('af-project').value) || p) : p;
      var targetTheme=document.getElementById('af-thema').value;
      if(!targetTheme || !targetProject.themas[targetTheme]) return null;
      return { project:targetProject, theme:targetTheme };
    }

    function persistActionFromForm(){
      var titelInput=document.getElementById('af-titel');
      if(!titelInput) return savedAction;
      var titel=titelInput.value.trim();
      if(!titel){
        titelInput.closest('.field').classList.add('has-error');
        setActionAutosaveStatus(savedAction?'Titel verplicht — laatste versie blijft bewaard':'Vul een titel in om de actie op te slaan','waiting');
        return savedAction;
      }
      titelInput.closest('.field').classList.remove('has-error');
      var target=currentActionTarget();
      if(!target){ setActionAutosaveStatus('Kies een geldig project en thema','error'); return savedAction; }

      var rawDocumentUrl=document.getElementById('af-document-url').value.trim();
      var normalizedDocumentUrl=normalizeDocumentUrl(rawDocumentUrl);
      var documentUrlValid=!rawDocumentUrl || !!safeDocumentUrl(normalizedDocumentUrl);
      if(!documentUrlValid) normalizedDocumentUrl=savedAction ? (savedAction.documentUrl||'') : '';

      var existingSubactions=savedAction && Array.isArray(savedAction.subacties) ? savedAction.subacties : [];
      var data={
        titel:titel,
        status:document.getElementById('af-status').value,
        prioriteit:document.getElementById('af-prioriteit').value,
        prioriteitsvlag:document.getElementById('af-prioriteitsvlag').checked,
        verantwoordelijke:document.getElementById('af-verantwoordelijke').value.trim(),
        wachtenOp:document.getElementById('af-wachten-op').value.trim(),
        deadline:document.getElementById('af-deadline').value,
        toelichting:document.getElementById('af-toelichting').value.trim(),
        documentLabel:document.getElementById('af-document-label').value.trim(),
        documentUrl:normalizedDocumentUrl,
        bijlage:pendingAttachment,
        subacties:existingSubactions,
        bijgewerktOp:new Date().toISOString().slice(0,10)
      };

      if(!savedAction){
        savedAction=Object.assign({ id:uid('act') },data);
        target.project.themas[target.theme].push(savedAction);
        savedProject=target.project;
        savedTheme=target.theme;
        setActionAutosaveStatus('Actie aangemaakt en opgeslagen');
      } else {
        if(savedProject!==target.project || savedTheme!==target.theme){
          if(savedProject && savedTheme && savedProject.themas[savedTheme]){
            savedProject.themas[savedTheme]=savedProject.themas[savedTheme].filter(function(a){ return a.id!==savedAction.id; });
          }
          target.project.themas[target.theme].push(savedAction);
          savedProject=target.project;
          savedTheme=target.theme;
          var deleteBtn=document.querySelector('[data-action="delete-action"]');
          if(deleteBtn){ deleteBtn.setAttribute('data-project',savedProject.id); deleteBtn.setAttribute('data-theme',savedTheme); }
          var checklistHost=document.getElementById('af-subaction-checklist-host');
          if(checklistHost) checklistHost.innerHTML=renderActionModalSubactionChecklist(savedAction,savedProject.id,savedTheme);
        }
        Object.assign(savedAction,data);
        setActionAutosaveStatus(documentUrlValid?'Automatisch opgeslagen':'Wijzigingen opgeslagen; documentlink nog niet geldig',documentUrlValid?'':'error');
      }
      scheduleSave();
      return savedAction;
    }

    actionModalAutosave=persistActionFromForm;

    actionForm.addEventListener('submit',function(e){ e.preventDefault(); persistActionFromForm(); });
    actionForm.querySelectorAll('input:not([type="file"]), select, textarea:not(#af-bulk-subactions)').forEach(function(el){
      el.addEventListener(el.tagName==='SELECT' || el.type==='checkbox' || el.type==='date' ? 'change' : 'input', persistActionFromForm);
    });

    if(bulkTextarea){
      bulkTextarea.addEventListener('change',function(){
        var parent=persistActionFromForm();
        var parsed=parseBulkTable(this.value||'');
        if(!parent || !parsed.items.length) return;
        var today=new Date().toISOString().slice(0,10);
        parsed.items.forEach(function(item){
          parent.subacties.push({
            id:uid('sub'), titel:item.titel, status:item.status, prioriteit:item.prioriteit,
            verantwoordelijke:item.verantwoordelijke, wachtenOp:item.wachtenOp, deadline:item.deadline,
            toelichting:item.toelichting, documentLabel:item.documentLabel, documentUrl:item.documentUrl,
            bijgewerktOp:today
          });
        });
        parent.bijgewerktOp=today;
        this.value='';
        renderActionBulkPreview({items:[],warnings:[]});
        var host=document.getElementById('af-subaction-checklist-host');
        if(host) host.innerHTML=renderActionModalSubactionChecklist(parent,savedProject.id,savedTheme);
        var summary=document.getElementById('af-subaction-summary');
        if(summary){
          var done=parent.subacties.filter(function(sa){ return sa.status==='afgerond'; }).length;
          summary.textContent=done+' van '+parent.subacties.length+' afgerond';
        }
        scheduleSave();
        setActionAutosaveStatus(parsed.items.length+' subactie'+(parsed.items.length===1?'':'s')+' automatisch toegevoegd');
      });
    }
  }

      };

    });

  function download(filename, text){
    var blob = new Blob([text], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function exportAll(){
    var payload = { bron:'Omgevingsmanagement dashboard', schemaVersion:7, geexporteerdOp:new Date().toISOString(), projects:state.projects };
    var today = new Date().toISOString().slice(0,10);
    download('omgevingsmanagement-alle-projecten-'+today+'.json', JSON.stringify(payload, null, 2));
    showToast('Alle projecten geëxporteerd.');
  }

  function handleImportFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{ parsed = JSON.parse(reader.result); }
      catch(e){ alert('Dit bestand is geen geldig JSON-bestand.'); return; }
      if(!parsed || !Array.isArray(parsed.projects)){
        alert('Dit JSON-bestand heeft niet de verwachte vorm (geen "projects"-lijst gevonden).');
        return;
      }
      var collisions = parsed.projects.filter(function(incoming){ return incoming && incoming.id && state.projects.some(function(p){ return p.id===incoming.id; }); }).length;
      if(collisions && !confirm(collisions+' bestaand project'+(collisions===1?' wordt':'en worden')+' bijgewerkt met gegevens uit deze import. Doorgaan?')) return;
      var toevoegd = 0, bijgewerkt = 0;
      parsed.projects.forEach(function(incoming){
        if(!incoming || !incoming.id || !incoming.naam) return;
        if(!incoming.themas) incoming.themas = emptyThemas();
        ensureProjectSchema(incoming);
        var existingIdx = state.projects.findIndex(function(p){ return p.id===incoming.id; });
        if(existingIdx>=0){ state.projects[existingIdx] = incoming; bijgewerkt++; }
        else { state.projects.push(incoming); toevoegd++; }
      });
      if(toevoegd+bijgewerkt===0){
        alert('Er zijn geen geldige projecten gevonden in dit bestand.');
        return;
      }
      if(parsed.projects[0]) state.activeProjectId = parsed.projects[0].id;
      renderAll(); scheduleSave();
      showToast('Geïmporteerd: ' + toevoegd + ' nieuw, ' + bijgewerkt + ' bijgewerkt.');
    };
    reader.onerror = function(){ alert('Het bestand kon niet worden gelezen.'); };
    reader.readAsText(file);
  }

  function renderMilestonesModule(project){
    var items=(project.milestones||[]).slice().sort(function(a,b){
      var da=a.datum||'9999-99-99', db=b.datum||'9999-99-99';
      return da<db?-1:(da>db?1:0);
    });
    var start=project.startdatum ? new Date(project.startdatum+'T00:00:00') : null;
    var end=project.einddatum ? new Date(project.einddatum+'T00:00:00') : null;
    var validRange=start && end && !isNaN(start.getTime()) && !isNaN(end.getTime()) && end>start;
    var body='';

    if(!validRange){
      var fallback=items.length ? items.map(function(m){
        var sm=milestoneStatusMeta(m.status);
        return '<div class="milestone-row"><div class="milestone-date">'+(m.datum?escapeHtml(formatDate(m.datum)):'Geen datum')+'</div><div class="milestone-main"><strong>'+escapeHtml(m.titel)+'</strong>'+(m.toelichting?'<div class="milestone-note">'+escapeHtml(m.toelichting)+'</div>':'')+'</div><div class="module-row-actions"><span class="module-status-pill '+sm.cls+'">'+sm.label+'</span><button type="button" class="action-icon" data-action="edit-milestone" data-project="'+project.id+'" data-id="'+m.id+'" title="Mijlpaal bewerken" aria-label="Mijlpaal bewerken">'+ICONS.edit+'</button></div></div>';
      }).join('') : '<div class="module-empty">Nog geen mijlpalen vastgelegd.</div>';
      body='<div class="milestone-timeline-empty"><strong>Stel eerst een geldige start- en einddatum voor het project in.</strong> Daarna worden de mijlpalen automatisch op een horizontale tijdlijn geplaatst.</div><div class="milestone-list">'+fallback+'</div>';
    } else {
      var totalMs=end-start;
      var dayMs=24*60*60*1000;
      var weekMs=7*dayMs;
      var today=new Date(); today.setHours(0,0,0,0);
      var todayRaw=((today-start)/totalMs)*100;
      var todayPct=Math.max(0,Math.min(100,todayRaw));
      var progress=todayPct;
      var dated=items.filter(function(m){ return !!m.datum; });
      var undated=items.filter(function(m){ return !m.datum; });

      // Weekstreepjes: iedere 7 dagen vanaf de projectstart; iedere vierde week iets nadrukkelijker.
      var totalWeeks=Math.floor(totalMs/weekMs);
      var tickStep=1;
      if(totalWeeks>160) tickStep=4;
      else if(totalWeeks>90) tickStep=2;
      var weekTicks='';
      for(var w=tickStep; w<=totalWeeks; w+=tickStep){
        var tickPct=((w*weekMs)/totalMs)*100;
        if(tickPct>=100) break;
        var major=(w%4===0);
        weekTicks += '<span class="milestone-week-tick'+(major?' major':'')+'" style="left:'+tickPct.toFixed(3)+'%" title="Week '+w+'"></span>';
      }

      // Eerstvolgende nog niet behaalde mijlpaal vanaf vandaag.
      var nextMilestone=null;
      for(var ni=0; ni<dated.length; ni++){
        var nd=new Date(dated[ni].datum+'T00:00:00');
        if(dated[ni].status!=='behaald' && nd>=today){ nextMilestone=dated[ni]; break; }
      }
      var nextWindow='';
      var nextLabel='';
      if(nextMilestone){
        var nextDate=new Date(nextMilestone.datum+'T00:00:00');
        var nextRaw=((nextDate-start)/totalMs)*100;
        var nextPct=Math.max(0,Math.min(100,nextRaw));
        if(todayRaw<=100 && nextRaw>=0 && nextPct>=todayPct){
          var weeksToNext=Math.max(0,(nextDate-today)/weekMs);
          var weeksLabel=weeksToNext<1 ? (Math.ceil((nextDate-today)/dayMs)+' dagen') : ((Math.round(weeksToNext*10)/10).toLocaleString('nl-NL',{maximumFractionDigits:1})+' wkn');
          var leftPct=Math.max(0,todayPct);
          var widthPct=Math.max(0,nextPct-leftPct);
          var labelPct=leftPct+(widthPct/2);
          nextWindow='<span class="milestone-next-window" style="left:'+leftPct.toFixed(2)+'%;width:'+widthPct.toFixed(2)+'%"></span>';
          nextLabel='<span class="milestone-next-label" style="left:'+labelPct.toFixed(2)+'%" title="Tot '+escapeHtml(nextMilestone.titel)+'">'+escapeHtml(weeksLabel)+'</span>';
        }
      }

      var todayContext=todayRaw<0 ? 'vóór projectstart' : (todayRaw>100 ? 'na projecteinde' : 'in project');
      var todayTitle='Vandaag: '+formatDate(toISODate(today))+(todayContext==='in project'?'':' · '+todayContext);
      var todayHtml='<span class="milestone-today'+((todayRaw<0||todayRaw>100)?' outside':'')+'" style="left:'+todayPct.toFixed(2)+'%" title="'+escapeHtml(todayTitle)+'"></span>';

      var markers=dated.map(function(m,idx){
        var d=new Date(m.datum+'T00:00:00');
        var raw=((d-start)/totalMs)*100;
        var outside=raw<0 || raw>100;
        var pct=Math.max(0,Math.min(100,raw));
        var sm=milestoneStatusMeta(m.status);
        var pos=idx%2===0?'above':'below';
        return '<button type="button" class="milestone-marker '+pos+' status-'+escapeHtml(m.status||'gepland')+(outside?' outside':'')+'" style="left:'+pct.toFixed(2)+'%" data-action="edit-milestone" data-project="'+project.id+'" data-id="'+m.id+'" title="'+escapeHtml(m.titel)+'">'+
          '<span class="milestone-connector"></span><span class="milestone-pin"></span><span class="milestone-card">'+
            '<span class="milestone-card-date">'+escapeHtml(formatDate(m.datum))+'</span><span class="milestone-card-title">'+escapeHtml(m.titel)+'</span><span class="milestone-card-status">'+escapeHtml(sm.label)+'</span>'+
          '</span></button>';
      }).join('');
      var undatedHtml=undated.length ? '<div class="milestone-undated"><span class="milestone-undated-label">Zonder datum:</span>'+undated.map(function(m){ return '<button type="button" data-action="edit-milestone" data-project="'+project.id+'" data-id="'+m.id+'">'+escapeHtml(m.titel)+'</button>'; }).join('')+'</div>' : '';
      body='<div class="milestone-timeline-wrap"><div class="milestone-timeline">'+
        '<div class="milestone-range"><div><span>Projectstart</span><strong>'+escapeHtml(formatDate(project.startdatum))+'</strong></div><div style="text-align:right"><span>Projecteinde</span><strong>'+escapeHtml(formatDate(project.einddatum))+'</strong></div></div>'+
        '<div class="milestone-stage"><div class="milestone-axis"><span class="milestone-axis-progress" style="width:'+progress.toFixed(2)+'%"></span>'+nextWindow+'<span class="milestone-week-ticks">'+weekTicks+'</span></div>'+todayHtml+nextLabel+markers+'</div>'+undatedHtml+
      '</div></div>';
    }

    return '<section class="project-module" id="module-milestones">'+
      '<div class="project-module-head"><div><h3>Mijlpalen</h3><div class="project-module-desc">Horizontale tijdlijn over de volledige doorlooptijd van het project.</div></div>'+
      '<button type="button" class="add-action-plus" data-action="new-milestone" data-project="'+project.id+'" title="Mijlpaal toevoegen" aria-label="Mijlpaal toevoegen">+</button></div>'+
      '<div class="project-module-body">'+body+'</div></section>';
  }

  function destroyProjectMap(){

  }

  function initMapModule(project){
    var el=document.getElementById('project-leaflet-map');
    if(!el) { destroyProjectMap(); return; }
    if(typeof window.L==='undefined'){
      el.innerHTML='<div class="map-load-error">Leaflet kon niet worden geladen. Controleer de internetverbinding en open het dashboard opnieuw.</div>';
      return;
    }
    destroyProjectMap();
    var saved=project.mapView||{center:[52.1326,5.2913],zoom:7};
    var center=(Array.isArray(saved.center)&&saved.center.length===2)?saved.center:[52.1326,5.2913];
    var zoom=Number.isFinite(saved.zoom)?saved.zoom:7;
    leafletProjectMap=window.L.map(el,{zoomControl:true}).setView(center,zoom);
    leafletProjectMapId=project.id;
    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:19,
      attribution:'&copy; OpenStreetMap-bijdragers'
    }).addTo(leafletProjectMap);
    window.L.control.scale({imperial:false}).addTo(leafletProjectMap);
    leafletLayerRefs={};
    (project.mapLayers||[]).forEach(function(item){
      try{
        var color=item.color||'#D92E7D';
        var layer=window.L.geoJSON(item.data,{
          style:function(){ return {color:color,weight:3,opacity:.9,fillColor:color,fillOpacity:.16}; },
          pointToLayer:function(feature,latlng){ return window.L.circleMarker(latlng,{radius:6,color:color,weight:2,fillColor:color,fillOpacity:.75}); },
          onEachFeature:function(feature,leafletLayer){ leafletLayer.bindPopup(mapPopupHtml(feature,item.naam)); }
        });
        leafletLayerRefs[item.id]=layer;
        if(item.visible!==false) layer.addTo(leafletProjectMap);
      }catch(err){ console.warn('GeoJSON-laag kon niet worden getekend',item.naam,err); }
    });
    leafletProjectMap.on('moveend zoomend',function(){
      if(!leafletProjectMap || leafletProjectMapId!==project.id) return;
      var c=leafletProjectMap.getCenter();
      project.mapView={center:[Number(c.lat.toFixed(6)),Number(c.lng.toFixed(6))],zoom:leafletProjectMap.getZoom()};
      scheduleSave();
    });
    setTimeout(function(){ if(leafletProjectMap) leafletProjectMap.invalidateSize(); },30);
  }

  function fitVisibleMapLayers(project,onlyLayerId){
    if(!leafletProjectMap || leafletProjectMapId!==project.id) return;
    var bounds=null;
    Object.keys(leafletLayerRefs).forEach(function(id){
      if(onlyLayerId && id!==onlyLayerId) return;
      var meta=(project.mapLayers||[]).find(function(x){ return x.id===id; });
      if(!meta || meta.visible===false) return;
      var lyr=leafletLayerRefs[id];
      try{
        var b=lyr.getBounds();
        if(b && b.isValid()) bounds=bounds?bounds.extend(b):b;
      }catch(e){}
    });
    if(bounds && bounds.isValid()) leafletProjectMap.fitBounds(bounds.pad(.08),{maxZoom:17});
  }

  function toggleMapLayer(project,layerId,visible){
    var meta=(project.mapLayers||[]).find(function(x){ return x.id===layerId; });
    if(!meta) return;
    meta.visible=visible;
    var lyr=leafletLayerRefs[layerId];
    if(leafletProjectMap && lyr){
      if(visible && !leafletProjectMap.hasLayer(lyr)) lyr.addTo(leafletProjectMap);
      if(!visible && leafletProjectMap.hasLayer(lyr)) leafletProjectMap.removeLayer(lyr);
    }
    scheduleSave();
  }

  function readGeoJsonFile(file){
    return new Promise(function(resolve,reject){
      if(!file){ reject(new Error('Geen bestand')); return; }
      if(file.size>5*1024*1024){ reject(new Error(file.name+' is groter dan 5 MB. Verklein de GeoJSON of splits deze op in meerdere lagen.')); return; }
      var reader=new FileReader();
      reader.onload=function(){
        try{
          var data=JSON.parse(reader.result);
          var valid=['FeatureCollection','Feature','Point','MultiPoint','LineString','MultiLineString','Polygon','MultiPolygon','GeometryCollection'].indexOf(data&&data.type)!==-1;
          if(!valid) throw new Error('Geen geldige GeoJSON-structuur');
          resolve({name:file.name.replace(/\.geojson$/i,''),data:data});
        }catch(err){ reject(new Error(file.name+' kon niet als geldige GeoJSON worden gelezen.')); }
      };
      reader.onerror=function(){ reject(new Error(file.name+' kon niet worden gelezen.')); };
      reader.readAsText(file);
    });
  }

  function handleGeoJsonFiles(projectId,fileList){
    var project=ensureProjectSchema(findProject(projectId));
    var files=Array.prototype.slice.call(fileList||[]);
    if(!project || !files.length) return;
    if((project.mapLayers||[]).length+files.length>20){ alert('Maximaal 20 GeoJSON-lagen per project. Verwijder eerst een bestaande laag.'); return; }
    Promise.allSettled(files.map(readGeoJsonFile)).then(function(results){
      var added=0,errors=[];
      results.forEach(function(result){
        if(result.status==='fulfilled'){
          var value=result.value;
          var idx=project.mapLayers.length;
          project.mapLayers.push({id:uid('maplayer'),naam:value.name||('GeoJSON-laag '+(idx+1)),data:value.data,visible:true,color:MAP_LAYER_COLORS[idx%MAP_LAYER_COLORS.length]});
          added++;
        } else { errors.push(result.reason&&result.reason.message?result.reason.message:'GeoJSON kon niet worden ingelezen.'); }
      });
      scheduleSave(); renderAll();
      setTimeout(function(){ fitVisibleMapLayers(project); },80);
      if(added) showToast(added+' GeoJSON-laag'+(added===1?'':'lagen')+' toegevoegd.');
      if(errors.length) alert(errors.join('\n'));
    });
  }

      }).join('');
      if(opts) html += '<optgroup label="'+escapeHtml(group.project.naam)+'">'+opts+'</optgroup>';

  function updatePomodoroVariant(suffix){
    var timeEl = document.getElementById('pomodoro-time'+suffix);
    if(!timeEl) return;
    var totalMs = POMODORO_DURATIONS[pomodoro.mode];
    var ms = pomodoro.running ? Math.max(0, pomodoro.endTime - Date.now()) : pomodoro.remainingMs;
    timeEl.textContent = formatTimer(ms);
    var modeEl = document.getElementById('pomodoro-mode'+suffix);
    if(modeEl) modeEl.textContent = POMODORO_LABELS[pomodoro.mode];
    var toggleBtn = document.getElementById('pomodoro-toggle-btn'+suffix);
    if(toggleBtn) toggleBtn.textContent = pomodoro.running ? 'Pauzeren' : 'Start';
    if(!suffix){
      var card = document.getElementById('pomodoro');
      if(card) card.className = 'pomodoro-card pomodoro-mode-' + pomodoro.mode + (pomodoro.running ? ' running' : '');
    }
    var cyclesEl = document.getElementById('pomodoro-cycles'+suffix);
    if(cyclesEl){
      var dots = '';
      for(var i=0;i<4;i++){ dots += (i < (pomodoro.cyclesCompleted % 4) ? '●' : '○'); }
      cyclesEl.textContent = dots;
    }
    var ring = document.getElementById('pomodoro-ring-fg'+suffix);
    if(ring){
      var fraction = totalMs>0 ? Math.max(0, Math.min(1, ms/totalMs)) : 0;
      ring.style.strokeDashoffset = (POMODORO_CIRC * (1-fraction)).toFixed(2);
      ring.style.stroke = (pomodoro.mode==='pauze' || pomodoro.mode==='lange_pauze') ? 'var(--status-done-dot)' : 'var(--accent)';
    }
  }

  function stopPomodoroClock(){
    if(pomodoroInterval){ clearInterval(pomodoroInterval); pomodoroInterval = null; }
    pomodoro.running = false;
    pomodoro.endTime = null;
  }

  function setPomodoroMode(mode){
    stopPomodoroClock();
    pomodoro.mode = mode;
    pomodoro.remainingMs = POMODORO_DURATIONS[mode];
  }

  function advancePomodoro(markActionComplete){
    var finishedFocus = pomodoro.mode === 'focus';
    stopPomodoroClock();
    if(finishedFocus){
      pomodoro.cyclesCompleted++;
      pomodoro.mode = (pomodoro.cyclesCompleted % 4 === 0) ? 'lange_pauze' : 'pauze';
    } else {
      pomodoro.mode = 'focus';
    }
    pomodoro.remainingMs = POMODORO_DURATIONS[pomodoro.mode];
    syncPomodoroTakeover();

    if(finishedFocus){
      var linked = findActionAnywhere(pomodoro.linkedActionId);
      if(linked){
        openActionUpdateModal(linked, {
          markComplete:!!markActionComplete,
          blocking:true,
          title:markActionComplete ? 'Actie afronden' : 'Focusblok afgerond'
        });
      } else {
        showToast('Focusblok klaar — tijd voor een pauze.');
        renderAll();
      }
    } else {
      showToast('Pauze voorbij — klaar voor de volgende focusronde?');
      renderAll();
    }
  }

  function pomodoroComplete(){
    advancePomodoro(false);
  }

  function pomodoroFinishEarly(){
    if(!pomodoro.running || pomodoro.mode !== 'focus') return;
    advancePomodoro(true);
  }

  function pomodoroSkipBreak(){
    if(pomodoro.mode==='focus') return;

          '<p class="pomodoro-complete-desc">Je werkte aan <strong>'+escapeHtml(linked.action.titel)+'</strong> — '+escapeHtml(linked.project.naam)+' / '+escapeHtml(linked.theme.label)+'. '+description+'</p>' +

  function pomodoroToggle(){
    if(pomodoro.running){
      pomodoro.remainingMs = Math.max(0, pomodoro.endTime - Date.now());
      stopPomodoroClock();
      syncPomodoroTakeover();
      renderAll();
    } else {
      if(pomodoro.remainingMs<=0 || !isFinite(pomodoro.remainingMs)) pomodoro.remainingMs = POMODORO_DURATIONS[pomodoro.mode];
      if(pomodoroInterval){ clearInterval(pomodoroInterval); pomodoroInterval = null; }
      pomodoro.endTime = Date.now() + pomodoro.remainingMs;
      pomodoro.running = true;
      pomodoroInterval = setInterval(pomodoroTick, 500);
      syncPomodoroTakeover();
    }
  }

  function pomodoroReset(){
    setPomodoroMode('focus');
    pomodoro.cyclesCompleted = 0;
    syncPomodoroTakeover();

  document.addEventListener('click', function(e){
    if(e.target.closest && e.target.closest('a.tp-status-link')) return;

    // Projecttegels zijn als geheel klikbaar. Bedieningsknoppen en de sleepgreep
    // behouden hun eigen gedrag en veroorzaken geen onbedoelde navigatie.
    var projectRow = e.target.closest && e.target.closest('.project-row');
    var rowControl = e.target.closest && e.target.closest('.p-actions, .p-grip, button, a, input, select, textarea');
    if(projectRow && !rowControl){
      currentScreen = 'project';
      state.activeProjectId = projectRow.getAttribute('data-id');
      openUtilityPlugin=null;
      renderAll();
      return;
    }

    var t = e.target.closest('[data-action]');
    if(!t) return;
    var action = t.getAttribute('data-action');
    var id = t.getAttribute('data-id');
    var theme = t.getAttribute('data-theme');
    var projId = t.getAttribute('data-project');
    var parentId = t.getAttribute('data-parent');

    switch(action){
      case 'select-project':
        currentScreen = 'project'; state.activeProjectId = id; openUtilityPlugin=null; renderAll(); break;
      case 'show-overview':
        currentScreen = 'overview'; openUtilityPlugin=null; renderAll(); break;
      case 'show-today':
        currentScreen = 'today'; openUtilityPlugin=null; renderAll(); break;
      case 'quick-add-submit':
        quickAddAction(); break;
      case 'new-project':
        openProjectModal(null); break;
      case 'edit-project':
        openProjectModal(id); break;
      case 'delete-project':
        if(confirm('Dit project en alle bijbehorende acties worden verwijderd. Doorgaan?')){
          state.projects = state.projects.filter(function(p){ return p.id!==id; });
          if(state.activeProjectId===id){ state.activeProjectId = state.projects.length ? state.projects[0].id : null; }
          closeModal(); renderAll(); scheduleSave();
        }
        break;
      case 'new-action':
        openActionModal(projId, theme, null); break;
      case 'bulk-subactions':
        openBulkSubactionsModal(projId, theme, id); break;
      case 'edit-subaction':
        openSubactionModal(projId, theme, parentId, id); break;
      case 'delete-subaction':
        if(confirm('Deze subactie verwijderen?')){
          var subFound=findSubaction(projId,theme,parentId,id);
          if(subFound){ subFound.parent.subacties=subFound.parent.subacties.filter(function(sa){ return sa.id!==id; }); }
          closeModal(); renderAll(); scheduleSave();
        }
        break;
      case 'edit-action':
        openActionModal(projId, theme, id); break;
      case 'delete-action':
        actionModalAutosave=null;
        if(confirm('Deze actie verwijderen?')){
          var pDel = findProject(projId);
          if(pDel){ pDel.themas[theme] = pDel.themas[theme].filter(function(a){ return a.id!==id; }); }
          closeModal(); renderAll(); scheduleSave();
        }
        break;
      case 'close-modal':
        if(blockingModal) break;
        closeModal(); break;
      case 'overlay-close':
        if(blockingModal) break;
        if(e.target===t) closeModal();
        break;
      case 'export-all':
        exportAll(); break;
      case 'import':
        document.getElementById('import-input').click(); break;
      case 'toggle-utility-plugin':
        var pluginKey=t.getAttribute('data-plugin');
        openUtilityPlugin=openUtilityPlugin===pluginKey ? null : pluginKey;
        renderAll(); break;
      case 'close-utility-plugin':
        openUtilityPlugin=null; renderAll(); break;
      case 'set-view':
        viewMode = t.getAttribute('data-view'); renderAll(); break;
      case 'set-overview-view':
        overviewViewMode = t.getAttribute('data-view'); renderAll(); break;
      case 'pomodoro-toggle':
        pomodoroToggle(); break;
      case 'pomodoro-reset':
        pomodoroReset(); break;
      case 'pomodoro-finish-early':
        pomodoroFinishEarly(); break;
      case 'pomodoro-skip-break':
        pomodoroSkipBreak(); break;
      case 'new-milestone':
        openMilestoneModal(projId,null); break;
      case 'edit-milestone':
        openMilestoneModal(projId,id); break;
      case 'delete-milestone':
        var pMil=findProject(projId);
        if(pMil && confirm('Deze mijlpaal verwijderen?')){ pMil.milestones=(pMil.milestones||[]).filter(function(m){ return m.id!==id; }); closeModal(); renderAll(); scheduleSave(); }
        break;
      case 'new-permit':
        openPermitModal(projId,null); break;
      case 'edit-permit':
        openPermitModal(projId,id); break;
      case 'delete-permit':
        var pPermit=findProject(projId);
        if(pPermit && confirm('Deze vergunning uit het register verwijderen?')){ pPermit.permits=(pPermit.permits||[]).filter(function(v){ return v.id!==id; }); closeModal(); renderAll(); scheduleSave(); }
        break;
      case 'fit-map-layers':
        var pMapFit=findProject(projId); if(pMapFit) fitVisibleMapLayers(pMapFit); break;
      case 'zoom-map-layer':
        var pMapZoom=findProject(projId); if(pMapZoom) fitVisibleMapLayers(pMapZoom,id); break;
      case 'delete-map-layer':
        var pMapDel=findProject(projId);
        if(pMapDel){
          var mapLayerDel=(pMapDel.mapLayers||[]).find(function(x){ return x.id===id; });
          if(mapLayerDel && confirm('Kaartlaag "'+mapLayerDel.naam+'" verwijderen?')){
            pMapDel.mapLayers=pMapDel.mapLayers.filter(function(x){ return x.id!==id; });
            renderAll(); scheduleSave();
          }
        }
        break;
      case 'new-theme-milestone':
        openThemeMilestoneModal(projId,theme,null); break;
      case 'edit-theme-milestone':
        openThemeMilestoneModal(projId,theme,id); break;
      case 'delete-theme-milestone':
        var pThemeMil=findProject(projId);

          pThemeMil.themeMilestones[theme]=(pThemeMil.themeMilestones[theme]||[]).filter(function(m){ return m.id!==id; });
          closeModal(); renderAll(); scheduleSave();

        break;
      case 'edit-thema-status':
        openThemaStatusModal(projId, theme); break;

        listFilterStatus = t.getAttribute('data-value'); renderAll(); break;

        calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth()-1, 1); renderAll(); break;
      case 'cal-next':
        calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth()+1, 1); renderAll(); break;
      case 'cal-today':
        calendarCursor = startOfMonth(new Date()); renderAll(); break;
      case 'toggle-email-paste':
        var box = document.getElementById('email-import-body');
        var hidden = !box.style.display || box.style.display==='none';
        box.style.display = hidden ? 'block' : 'none';
        t.textContent = hidden ? 'verberg plakvak' : 'of plak e-mailtekst';
        if(hidden){ var ta = document.getElementById('email-paste'); if(ta) ta.focus(); }
        break;
      case 'parse-email':
        var raw = document.getElementById('email-paste').value;
        if(!raw.trim()) break;
        var parsed = parseEmailText(raw);
        var titelEl = document.getElementById('af-titel');
        var verEl = document.getElementById('af-verantwoordelijke');
        var toelEl = document.getElementById('af-toelichting');
        if(titelEl && parsed.titel) titelEl.value = parsed.titel;
        if(verEl && parsed.afzender) verEl.value = parsed.afzender;
        if(toelEl && parsed.body) toelEl.value = parsed.body;
        titelEl.closest('.field').classList.remove('has-error');
        if(typeof actionModalAutosave==='function') actionModalAutosave();
        showToast('Gegevens overgenomen — controleer en pas aan waar nodig.');
        break;
      case 'download-pending-attachment':
        if(pendingAttachment && pendingAttachment.inhoud){ downloadEml(pendingAttachment.naam, pendingAttachment.inhoud); }
        else { alert('Deze bijlage kon niet volledig geladen worden. Voeg het bestand opnieuw toe.'); }
        break;

        if(fileInp) fileInp.value = '';
        if(typeof actionModalAutosave==='function') actionModalAutosave();
        break;

        var projA = findProject(projId);
        if(projA){
          var foundAct = (projA.themas[theme]||[]).find(function(a){ return a.id===id; });
          if(foundAct && foundAct.bijlage){
            if(foundAct.bijlage.inhoud){ downloadEml(foundAct.bijlage.naam, foundAct.bijlage.inhoud); }
            else { alert('Deze bijlage kon niet volledig geladen worden. Open de actie en voeg het bestand opnieuw toe.'); }
          }

        break;

          action.status = e.target.value;
          action.bijgewerktOp = new Date().toISOString().slice(0,10);
          renderAll(); scheduleSave();

      }

    if(e.target.matches('[data-action="toggle-subaction-complete"]')){
      var checkFound=findSubaction(e.target.getAttribute('data-project'),e.target.getAttribute('data-theme'),e.target.getAttribute('data-parent'),e.target.getAttribute('data-id'));
      if(checkFound && checkFound.subaction){

        checkFound.parent.bijgewerktOp=checkFound.subaction.bijgewerktOp;
        var checkRow=e.target.closest('.action-subaction-check');
        if(checkRow) checkRow.classList.toggle('done',e.target.checked);
        var summaryEl=document.getElementById('af-subaction-summary');
        if(summaryEl){
          var currentSubs=checkFound.parent.subacties||[];
          var currentDone=currentSubs.filter(function(sa){ return sa.status==='afgerond'; }).length;
          summaryEl.textContent=currentDone+' van '+currentSubs.length+' afgerond';
        }
        renderAll(); scheduleSave();
      }
    }
    if(e.target.matches('[data-action="change-subaction-status"]')){
      var subFoundStatus=findSubaction(e.target.getAttribute('data-project'),e.target.getAttribute('data-theme'),e.target.getAttribute('data-parent'),e.target.getAttribute('data-id'));
      if(subFoundStatus && subFoundStatus.subaction){

        subFoundStatus.subaction.bijgewerktOp=new Date().toISOString().slice(0,10);
        subFoundStatus.parent.bijgewerktOp=subFoundStatus.subaction.bijgewerktOp;
        renderAll(); scheduleSave();
      }
    }
    if(e.target.matches('[data-action="set-list-sort"]')){
      listSort = e.target.value; renderAll();
    }
    if(e.target.matches('[data-action="set-overview-project-filter"]')){

      refreshQuickAddThemes();

    if(e.target.id==='pomodoro-action-select'){
      pomodoro.linkedActionId = e.target.value || null;
    }
    if(e.target.id==='af-eml-input'){
      var file = e.target.files && e.target.files[0];
      e.target.value = '';
      handleEmlFile(file);
    }
    if(e.target.matches('[data-action="toggle-map-layer"]')){
      var mapProject=findProject(e.target.getAttribute('data-project'));
      if(mapProject) toggleMapLayer(mapProject,e.target.getAttribute('data-id'),e.target.checked);

    if(e.target.id==='geojson-input'){

      var geoProjectId=e.target.getAttribute('data-project');
      if(geoFiles && geoFiles.length) handleGeoJsonFiles(geoProjectId,geoFiles);

    if(e.target.id==='import-input'){
      var importFile = e.target.files && e.target.files[0];
      if(importFile) handleImportFile(importFile);
      e.target.value = '';
    }

    var fromIdx = state.projects.findIndex(function(p){ return p.id===draggedId; });

    if(fromIdx===-1 || toIdx===-1) return;

  });

  document.addEventListener('drop', function(e){
    var cell = e.target.closest && e.target.closest('.cal-cell[data-date]');
    if(!cell || !draggedChip) return;
    e.preventDefault();
    cell.classList.remove('cal-drop-target');
    var newDate = cell.getAttribute('data-date');
    var proj = findProject(draggedChip.projectId);
    var chipInfo = draggedChip;
    draggedChip = null;
    if(!proj) return;
    var action = (proj.themas[chipInfo.themeKey]||[]).find(function(a){ return a.id===chipInfo.actionId; });
    if(!action || action.deadline===newDate) return;
    action.deadline = newDate;
    action.bijgewerktOp = new Date().toISOString().slice(0,10);
    renderAll(); scheduleSave();
    showToast('Deadline verplaatst naar ' + formatDate(newDate) + '.');
  });

  document.addEventListener('dragend', function(){
    var chips = document.querySelectorAll('.cal-chip.dragging');
    for(var i=0;i<chips.length;i++){ chips[i].classList.remove('dragging'); }
    var cells = document.querySelectorAll('.cal-cell.cal-drop-target');
    for(var j=0;j<cells.length;j++){ cells[j].classList.remove('cal-drop-target'); }
    draggedChip = null;
  });

  document.addEventListener('keydown', function(e){
    if(e.key==='Escape'){
      if(blockingModal) return;
      var overlay = document.querySelector('.modal-overlay');
      if(overlay) closeModal();
    }
  });

  document.getElementById('new-project-btn').innerHTML = ICONS.plus + ' Nieuw project';
  updatePomodoroDisplay();

  /* ============ authenticatie (magic link via Supabase) ============ */

  function showAuthOverlay(){ document.getElementById('auth-overlay').classList.add('visible'); }
  function hideAuthOverlay(){ document.getElementById('auth-overlay').classList.remove('visible'); }
  function setAuthStatus(msg, type){
    var el = document.getElementById('auth-status');
    el.textContent = msg || '';
    el.className = type || '';
  }

  function startApp(){
    if(appStarted) return;
    appStarted = true;
    hideAuthOverlay();
    loadFromStorage().then(function(loaded){
      renderAll();
    });
  }

  /* ============ init ============ */

  if(supabaseClient){
    var logoutBtn = document.getElementById('logout-btn');
    logoutBtn.style.display = 'flex';
    logoutBtn.addEventListener('click', function(){
      appStarted = false;
      supabaseClient.auth.signOut();
    });

    document.getElementById('auth-form').addEventListener('submit', function(e){
      e.preventDefault();
      var email = document.getElementById('auth-email').value.trim();
      if(!email) return;
      var btn = document.getElementById('auth-submit');
      btn.disabled = true;
      setAuthStatus('Bezig met versturen…', '');
      supabaseClient.auth.signInWithOtp({
        email: email,
        options: { emailRedirectTo: window.location.origin + window.location.pathname }
      }).then(function(res){
        btn.disabled = false;
        if(res.error){ setAuthStatus('Kon geen link versturen: ' + res.error.message, 'error'); return; }
        setAuthStatus('Check je mail — klik op de link om in te loggen.', 'success');
      }).catch(function(){
        btn.disabled = false;
        setAuthStatus('Er ging iets mis. Probeer het opnieuw.', 'error');
      });
    });

    showAuthOverlay();
    supabaseClient.auth.onAuthStateChange(function(event, session){
      if(session && session.user){
        currentUserId = session.user.id;
        startApp();
      } else {
        currentUserId = null;
        appStarted = false;
        showAuthOverlay();
      }
    });
    supabaseClient.auth.getSession().then(function(res){
      var session = res && res.data && res.data.session;
      if(session && session.user){
        currentUserId = session.user.id;
        startApp();
      }
    });
  } else {
    // Geen Supabase geconfigureerd (SUPABASE_URL niet ingevuld): app werkt lokaal zonder login.
    startApp();
  }

})();
</script>
</body>
</html>
